# Upgrades must not delete the version a running process is executing from:
# mise up would prune the old install dir out from under a live session.
[settings]
upgrade.auto_prune = false
shims.exclude = [
  "agy",
  "claude",
  "codex",
  "copilot",
  "crush",
  "cursor-agent",
  "gemini",
  "grok",
  "hermes",
  "hunk",
  "kimi",
  "muse",
  "omp",
  "openclaw",
  "opencode",
  "ori",
  "pi",
]
