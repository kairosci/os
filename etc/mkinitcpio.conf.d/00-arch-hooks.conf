# The platform's HOOKS baseline. mkinitcpio sources mkinitcpio.conf and then
# every drop-in here in name order, so the baseline sorts first and the drop-ins
# after it add their hooks to it instead of being overwritten by it.
#
# Apple Silicon boots a systemd initramfs, and its platform package adds the
# firmware and encryption hooks. Every other machine keeps the busybox line, as
# does one without the runtime's detector. A detector that cannot place the
# machine stops the build rather than let it produce an image for the wrong
# platform.
_arch_platform=""
if _arch_detector=$(command -v arch-hw-platform); then
  _arch_platform=$("$_arch_detector") || return 1
fi
# arch-settings can update before the arch runtime whose detector still
# says apple-silicon.
[[ $_arch_platform != "apple-silicon" ]] || _arch_platform=aarch64-apple

# A Mac whose mkinitcpio.conf carries the asahi hook, or the busybox encrypt
# hook that unlocks it through cryptdevice= (sd-encrypt cannot parse that), boots
# the initramfs its platform set up without the Apple boot package, as a legacy
# install does. Its line stays as it is. The asahi hook also marks such a root
# off a Mac, as in a chroot or a VM.
if [[ " ${HOOKS[*]:-} " == *" asahi "* ]] ||
  [[ $_arch_platform == "aarch64-apple" && " ${HOOKS[*]:-} " == *" encrypt "* ]]; then
  _arch_platform=platform-owned
fi

case $_arch_platform in
  platform-owned) ;;
  aarch64-apple)
    HOOKS=(base systemd plymouth autodetect microcode modconf kms keyboard sd-vconsole block filesystems fsck)
    ;;
  *)
    HOOKS=(base udev plymouth keyboard autodetect microcode modconf kms keymap consolefont block encrypt filesystems fsck)
    ;;
esac
unset _arch_platform _arch_detector
