name: Arch ISO release

on:
  push:
    tags: [v*]
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch, tag, or commit to build; publishing requires a v* tag
        required: true
        type: string
        default: main
      publish:
        description: Publish the generated image parts to an existing v* tag named by source_ref
        required: true
        type: boolean
        default: false

permissions:
  contents: read

env:
  AP: ${{ github.workspace }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  queue: max
  cancel-in-progress: false

jobs:
  validate:
    name: Validate ISO source and release target
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      source_commit: ${{ steps.source.outputs.commit }}
      release_tag: ${{ steps.source.outputs.release_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate build revision and optional release tag
        id: source
        env:
          SOURCE_REF: ${{ inputs.source_ref || github.ref }}
          PUBLISH_RELEASE: ${{ inputs.publish || startsWith(github.ref, 'refs/tags/v') }}
        run: |
          release_tag=${SOURCE_REF#refs/tags/}
          if [[ $PUBLISH_RELEASE == true ]]; then
            if [[ $release_tag == *$'\n'* || $release_tag == *$'\r'* ]]; then
              printf '%s\n' 'Publishing requires source_ref to name an existing v* tag.' >&2
              exit 1
            fi
            if [[ ! $release_tag =~ ^v[A-Za-z0-9][A-Za-z0-9._+-]*$ ]] || ! git show-ref --verify --quiet "refs/tags/$release_tag"; then
              printf '%s\n' 'Publishing requires source_ref to name an existing v* tag.' >&2
              exit 1
            fi
            tag_commit=$(git rev-parse --verify "refs/tags/$release_tag^{commit}")
            if [[ $tag_commit != "$(git rev-parse HEAD)" ]]; then
              printf '%s\n' 'The selected release tag does not point to the checked-out source.' >&2
              exit 1
            fi
          else
            release_tag=
          fi
          printf 'commit=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          printf 'release_tag=%s\n' "$release_tag" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.platform }} image
    needs: validate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x86
            architecture: x86_64
            runner: ubuntu-24.04
          - platform: aarch64
            architecture: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.source_commit }}
          persist-credentials: false
      - name: Set reproducible image timestamp
        run: printf 'SOURCE_DATE_EPOCH=%s\n' "$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"
      - name: Verify runner architecture
        env:
          TARGET_ARCH: ${{ matrix.architecture }}
        run: |
          if [[ $TARGET_ARCH != "$(uname -m)" ]]; then
            printf 'Runner architecture mismatch: expected %s, got %s\n' "$TARGET_ARCH" "$(uname -m)" >&2
            exit 1
          fi
      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install --yes apparmor podman python3-yaml
          if [[ $(sudo podman info --format '{{.Host.Security.Rootless}}') != false ]]; then
            printf '%s\n' 'Podman must run as the isolated GitHub runner user.' >&2
            exit 1
          fi
      - name: Build native ArchISO profile and bounded release assets
        run: make iso
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: archiso-${{ matrix.platform }}
          path: build/iso/release-assets/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: iso-image-${{ matrix.platform }}
          path: build/iso/*.iso
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  release:
    name: Publish checksummed images
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    needs: [validate, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.source_commit }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: archiso-*
          path: release-assets
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: iso-image-*
          path: release-assets
          merge-multiple: true
      - name: Install release tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes python3-yaml
      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
        run: |
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$RELEASE_TAG"
          fi
          AP="$GITHUB_WORKSPACE" python3 -m scripts.iso.publish "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --assets-dir release-assets
