name: Validate package modules

on:
  pull_request:

permissions:
  contents: read

jobs:
  modules-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Validate module declarations
        run: python3 scripts/modules.py validate
      - name: Assemble and verify package trees
        run: python3 tests/shell.d/modules-test.py
