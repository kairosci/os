name: Check translation structure

# The pull-request gate for i18n: individual PRs only add the English side
# (code plus English catalog entries), so this validates structure, not
# completeness. Missing translations are pending work for the sync workflow.
# The job runs on every PR (and passes trivially when nothing i18n-relevant
# changed) so it can be a required status check without blocking PRs that
# never trigger a path-filtered workflow.
on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  i18n-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check whether anything i18n-relevant changed
        id: relevant
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch origin "$BASE_REF"
          if git diff --name-only "origin/$BASE_REF...HEAD" | grep -qE '^(default/i18n/|default/arch/arch-menu\.jsonc|src/shell/|src/commands/|docs/user/|scripts/i18n-sync\.py|tests/shell\.d/i18n-test\.sh|\.github/workflows/i18n-)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "No i18n-relevant files changed; passing."
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.relevant.outputs.relevant == 'true'
        with:
          node-version: 24
      - name: Structural i18n test
        if: steps.relevant.outputs.relevant == 'true'
        run: I18N_STRUCTURAL=1 bash tests/shell.d/i18n-test.sh
      - name: No embedded English literals
        if: steps.relevant.outputs.relevant == 'true'
        run: python3 scripts/i18n-sync.py extract-scan --check
