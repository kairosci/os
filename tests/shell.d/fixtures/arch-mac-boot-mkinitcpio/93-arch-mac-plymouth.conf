# Plymouth draws the disk password prompt and the boot splash, as on x86
# os. It goes right after systemd so its initrd units order correctly,
# only when the hook is installed, and never twice.
if [[ -f /usr/lib/initcpio/installer/plymouth && " ${HOOKS[*]} " != *" plymouth "* ]]; then
  _arch_mac_plymouth_hooks=()
  _arch_mac_plymouth_added=false
  for _arch_mac_plymouth_hook in "${HOOKS[@]}"; do
    _arch_mac_plymouth_hooks+=("$_arch_mac_plymouth_hook")
    if [[ $_arch_mac_plymouth_hook == systemd && $_arch_mac_plymouth_added == false ]]; then
      _arch_mac_plymouth_hooks+=(plymouth)
      _arch_mac_plymouth_added=true
    fi
  done
  if [[ $_arch_mac_plymouth_added == true ]]; then
    HOOKS=("${_arch_mac_plymouth_hooks[@]}")
  fi
  unset _arch_mac_plymouth_hooks _arch_mac_plymouth_added _arch_mac_plymouth_hook
fi
