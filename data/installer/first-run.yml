gnome_theme:
  commands:
    - [gsettings, set, org.gnome.desktop.interface, gtk-theme, Breeze-Dark]
    - [gsettings, set, org.gnome.desktop.interface, color-scheme, prefer-dark]
    - [gsettings, set, org.gnome.desktop.interface, icon-theme, Cosmic]
gtk_primary_paste:
  commands:
    - [gsettings, set, org.gnome.desktop.interface, gtk-enable-primary-paste, "true"]
audio_tuning:
  commands:
    - [arch-audio-tuning, "on"]
welcome:
  command: [arch-notification-send, -u, critical, -g, ]
  action: [--exec, arch-menu-keybindings]
  messages:
    en:
      title: Learn Keybindings
      body: |-
        Super + K for cheatsheet.
        Super + Space for os Menu.
    it:
      title: Scopri le scorciatoie
      body: |-
        Super + K per il promemoria.
        Super + Space per il menu os.
wifi:
  worker: wifi_worker
  network:
    startup_wait: [nm-online, -q, -s, -t, "30"]
    connectivity_check: [nm-online, -q, -x, -t, "30"]
    connection_wait: [nm-online, -q, -t, "3600"]
  update:
    check: [checkupdates, --nocolor]
    no_updates_status: 2
    installed_path: /usr/share/arch
    checkout_check: [archctl, update, available]
  wifi_notification:
    command: [arch-notification-send, -u, critical, -g, 󰖩]
    action: [--exec, arch-shell, shell, toggle, arch.network]
    messages:
      en:
        title: Setup Wi-Fi
        body: Click to configure the wireless network.
      it:
        title: Configura il Wi-Fi
        body: Fai clic per configurare la rete wireless.
  update_notification:
    command: [arch-notification-send, -u, critical, -g, ]
    action: [--exec, arch-launch-terminal, arch-update]
    messages:
      en:
        title: Update System
        body: Click to update the system.
      it:
        title: Aggiorna il sistema
        body: Fai clic per aggiornare il sistema.
default_language: en
orchestrator:
  command_name: arch-provision-first-run
  force_option: --force
  state_directory: .local/state/arch
  log_file: first-run.log
  completion_marker: first-run-user
  timestamp_format: '%Y-%m-%d %H:%M:%S'
  notification_wait_before: welcome
  done_check: [archctl, done, check, '{completion_marker}']
  done_mark: [archctl, done, mark, '{completion_marker}']
  provision_user: [arch-provision-user]
  notification_wait: [archctl, notification, wait]
  messages:
    en:
      description: Run first-login user setup and notification hooks. By default this runs once per user.
      force_help: Run setup again even if it was already completed.
      already_complete: First-run already complete.
      starting: 'Starting: {step}'
      completed: 'Completed: {step}'
      failed: 'Failed: {step} (exit code: {status})'
      notification_timeout: Timed out waiting for notification service; continuing
      retry: One or more first-run steps failed; first-run will retry next login
    it:
      description: Esegue la configurazione iniziale e le notifiche. Per impostazione predefinita viene eseguita una sola volta per utente.
      force_help: Ripete la configurazione anche se è già stata completata.
      already_complete: Configurazione iniziale già completata.
      starting: 'Avvio: {step}'
      completed: 'Completato: {step}'
      failed: 'Non riuscito: {step} (codice di uscita: {status})'
      notification_timeout: Attesa del servizio notifiche scaduta; continuo
      retry: Uno o più passaggi non sono riusciti; la configurazione verrà ripetuta al prossimo accesso
    steps:
      en:
        fingerprint_hook: install fingerprint setup post-update hook
        user_units: enable user systemd units
        platform_setup: run the platform's user setup
        gnome_theme: set GNOME theme
        gtk_primary_paste: set GTK primary paste
        audio_tuning: apply speaker tuning
        welcome: show welcome notification
        network: schedule Wi-Fi/update notifications
      it:
        fingerprint_hook: installa l'hook post-aggiornamento per le impronte
        user_units: abilita le unità systemd utente
        platform_setup: esegui la configurazione utente della piattaforma
        gnome_theme: imposta il tema GNOME
        gtk_primary_paste: imposta l'incolla primario GTK
        audio_tuning: applica la regolazione audio
        welcome: mostra la notifica iniziale
        network: pianifica le notifiche Wi-Fi e aggiornamenti
  steps:
    - id: fingerprint_hook
      command: [archctl, hook, install, post-update, '{ap}/src/arch/python/installer_user/first_run/fingerprint_invitation.py']
    - id: user_units
      command: [python3, -I, '{ap}/src/arch/python/installer_user/first_run/commands.py', user_units]
    - id: platform_setup
      command: [arch-lifecycle-dispatch, setup-user]
    - id: gnome_theme
      command: [python3, -I, '{ap}/src/arch/python/installer_user/first_run/commands.py', gnome_theme]
    - id: gtk_primary_paste
      command: [python3, -I, '{ap}/src/arch/python/installer_user/first_run/commands.py', gtk_primary_paste]
    - id: audio_tuning
      command: [python3, -I, '{ap}/src/arch/python/installer_user/first_run/commands.py', audio_tuning]
    - id: welcome
      command: [python3, -I, '{ap}/src/arch/python/installer_user/first_run/commands.py', welcome]
    - id: network
      command: [python3, -I, '{ap}/src/arch/python/installer_user/first_run/commands.py', wifi]
user_units:
  input_method: [arch-input-method, configure, --defaults]
  daemon_reload: [systemctl, --user, daemon-reload]
  enable: [systemctl, --user, enable, --now]
  units:
    - arch-shell.service
    - arch-recover-internal-monitor.service
    - arch-sleep-lock.service
    - arch-fcitx5.service
    - arch-crash-watch.service
  messages:
    en: Input method defaults deferred; run archctl setup input after login.
    it: Configurazione del metodo di input rimandata; esegui archctl setup input dopo l'accesso.
fingerprint_invitation:
  hardware_check: [archctl, hw, fingerprint]
  pam_file: /etc/pam.d/arch-lock-fingerprint
  marker: [archctl, done, ensure, fingerprint-setup-invitation]
  notification:
    command: [arch-notification-send, -u, critical, -g, 󰈷]
    action: [--exec, arch-launch-terminal, arch-setup-security-fingerprint]
    messages:
      en:
        title: Setup Fingerprint Reader
        body: Enable sudo and unlocking with your fingerprint.
      it:
        title: Configura il lettore d'impronte
        body: Abilita sudo e lo sblocco con l'impronta digitale.
