speaker_tuning:
  match_command: [arch-audio-tuning, match]
  package_command: [arch-pkg-add]
  packages: [lsp-plugins-lv2]

surface_firmware:
  checks:
    - [arch-hw-surface]
    - [arch-hw-x86]
  package_command: [arch-pkg-add]
  package: linux-firmware-marvell

package_gates:
  package_command: [arch-pkg-add]
  rules:
    - checks:
        - [arch-hw-asus-rog]
      packages: [asusctl]
    - checks:
        - [arch-hw-framework16]
      packages: [qmk-hid]
    - checks:
        - [arch-hw-dell-xps-haptic-touchpad]
      packages: [dell-xps-touchpad-haptics]

    - checks:
        - [arch-hw-intel-sof]
      packages: [sof-firmware]

intel_video_acceleration:
  pci_command: [lspci]
  package_command: [arch-pkg-add]
  gpu_line_pattern: '(vga|3d|display).*intel'
  modern_gpu_pattern: '(hd graphics|uhd graphics|xe|iris|arc|panther lake)'
  legacy_gpu_pattern: 'gma'
  modern_packages: [intel-media-driver, libvpl, vpl-gpu-rt]
  legacy_packages: [libva-intel-driver]

intel_panther_lake_fred:
  hardware_check: [arch-hw-intel-ptl]
  target: /etc/limine-entry-tool.d/intel-panther-lake-fred.conf
  enabled_pattern: 'fred=on'
  content: "# Intel Panther Lake FRED support\nKERNEL_CMDLINE[default]+=\" fred=on\"\n"
  install_command: [sudo, install, -D, -m, '0644']

intel_wifi7_eht_workaround:
  pci_command: [lspci, -nn]
  device_pattern: '\[8086:(e440|272b)\]'
  target: /etc/modprobe.d/iwlwifi-disable-eht.conf
  mode: '0644'
  content: "# Temporary fix Dell XPS 14/16 on Panther lake\n# Disable WiFi 7 (EHT) on Intel BE200/BE211 — broken RX rate adaptation\n# Remove this file when fixes land in the iwlwifi EHT data path\noptions iwlwifi disable_11be=Y\n"
  statuses: {complete: 0, failed: 1}

qualcomm_camera:
  check_command: [arch-hw-aarch64-qualcomm]
  package_command: [arch-pkg-add]
  package: pipewire-libcamera

synaptic_touchpad:
  device_file_environment: ARCH_SYNAPTIC_INPUT_DEVICES
  device_file_default: /proc/bus/input/devices
  device_pattern: synaptics
  loaded_modules_command: [lsmod]
  loaded_module_pattern: '^psmouse'
  resolve_module_command: [modprobe, -qn, psmouse]
  load_module_command: [modprobe, psmouse, synaptics_intertouch=1]
  messages:
    en:
      load_failed: "Warning: could not enable Synaptics InterTouch on psmouse"
    it:
      load_failed: "Avviso: impossibile attivare Synaptics InterTouch su psmouse"
wireless_regdom:
  root_environment: ARCH_SYSTEM_ROOT
  regdom_file: etc/conf.d/wireless-regdom
  localtime_file: etc/localtime
  zoneinfo_directory: usr/share/zoneinfo
  zone_table: usr/share/zoneinfo/zone.tab
  existing_setting_pattern: '^WIRELESS_REGDOM='
  country_pattern: '^[A-Z]{2}$'
  zone_table_country_column: 0
  zone_table_timezone_column: 2
  line_template: 'WIRELESS_REGDOM="{country}"'
apple_keyboard_fkeys:
  config_environment: ARCH_HID_APPLE_CONF
  config_default: /etc/modprobe.d/hid_apple.conf
  apple_predicate: [arch-hw-aarch64-apple]
  content: "options hid_apple fnmode=2\n"
  mode: '0644'
network_setup:
  systemctl_command: [systemctl]
  disable_units:
    - iwd.service
    - systemd-networkd.service
    - systemd-networkd.socket
    - systemd-networkd-varlink.socket
    - systemd-networkd-varlink-metrics.socket
    - systemd-networkd-resolve-hook.socket
    - systemd-networkd-wait-online.service
  mask_units: [systemd-networkd-wait-online.service]
  network_directory: /etc/systemd/network
  backup_directory_template: arch-networkd-retired-{timestamp}
  timestamp_format: '%Y%m%d%H%M%S'
  network_files: [20-ethernet.network, 20-wlan.network, 20-wwan.network]
  dhcp_pattern: '^\s*DHCP=yes\s*$'
  interface_pattern: '^\s*Name=(en\*|eth\*|wl\*|ww\*)\s*$'
  manager_active_command: [systemctl, is-active, --quiet, NetworkManager.service]
  stop_command: [systemctl, stop, systemd-networkd.service]
bluetooth_setup:
  enable_command: [systemctl, enable, bluetooth.service]
  deferred_environment: ARCH_IMAGE_DEFERRED_HARDWARE
  deferred_value: '1'
  start_command: [systemctl, start, --no-block, bluetooth.service]
nvidia_apps_setup:
  package_check_command: [arch-pkg-present]
  workbench_package: nvidia-ai-workbench
  workbench_command: [nvidia-ctk, runtime, configure, --runtime=docker]
  dashboard_package: dgx-dashboard
  enable_command: [systemctl, enable, dgx-dashboard.service]
  deferred_environment: ARCH_IMAGE_DEFERRED_HARDWARE
  deferred_value: '1'
  start_command: [systemctl, start, --no-block, dgx-dashboard.service]
vulkan_setup:
  pci_command: [lspci]
  driver_rules:
    - pattern: '(VGA|Display).*Intel'
      package: vulkan-intel
    - pattern: '(VGA|Display).*AMD'
      package: vulkan-radeon
    - pattern: '(VGA|Display).*Apple'
      package: vulkan-asahi
  platform_check: [arch-hw-aarch64-qualcomm]
  platform_package: vulkan-freedreno
  package_command: [arch-pkg-add]
broadcom_wifi_setup:
  pci_command: [lspci, -nn]
  device_ids: [14e4:43a0, 14e4:4331]
  detected_message:
    en: "BCM4360 / BCM4331 detected"
    it: "Rilevati BCM4360 / BCM4331"
  package_command: [arch-pkg-add, broadcom-wl-dkms]
qualcomm_kernel_params:
  platform_check: [arch-hw-aarch64-qualcomm]
  destination_environment: ARCH_QUALCOMM_KERNEL_PARAMS_FILE
  destination_default: /etc/limine-entry-tool.d/qualcomm-snapdragon.conf
  mode: '0644'
  content: |-
    # Generated by os for Qualcomm Snapdragon devices.
    # Keep display and I/O resources enabled until their drivers load.
    # Disable pointer authentication and waiting for an unavailable TPM.
    KERNEL_CMDLINE[default]+=" clk_ignore_unused pd_ignore_unused arm64.nopauth systemd.tpm2_wait=0"
    # Translate device memory access, as Arch Linux ARM's kernel does by default.
    # On a kernel that defaults to passthrough, the Yoga Slim 7x's keyboard,
    # touchpad and touchscreen read back empty descriptors and never appear.
    KERNEL_CMDLINE[default]+=" iommu.passthrough=0"
intel_power_setup:
  cpu_info_file: /proc/cpuinfo
  cpu_model_pattern: '^model\s*:\s*(\d+)'
  thermald:
    checks:
      - [arch-hw-intel]
    minimum_cpu_model: 42
    missing_cpu_model: 0
    battery_check: [arch-battery-present]
    package_command: [arch-pkg-add, thermald]
    enable_command: [sudo, systemctl, enable, thermald.service]
  lpmd:
    checks:
      - [arch-hw-intel]
      - [arch-battery-present]
    supported_cpu_models: [151, 154, 170, 172, 183, 186, 189, 191, 204]
    package_command: [arch-pkg-add, intel-lpmd]
    enable_command: [sudo, systemctl, enable, intel_lpmd.service]
nvidia_driver_setup:
  n1x_check: [arch-hw-aarch64-n1x]
  pci_command: [lspci]
  pci_pattern: nvidia
  gsp_check: [arch-hw-nvidia-gsp]
  gsp_packages: [nvidia-open-dkms, nvidia-utils]
  gsp_x86_packages: [lib32-nvidia-utils]
  gsp_common_packages: [libva-nvidia-driver]
  legacy_check: [arch-hw-nvidia-without-gsp]
  legacy_packages: [nvidia-580xx-dkms, nvidia-580xx-utils]
  legacy_x86_packages: [lib32-nvidia-580xx-utils]
  x86_check: [arch-hw-x86]
  package_command: [arch-pkg-add]
  system_root_environment: ARCH_SYSTEM_ROOT
  config_files:
    - path: etc/modprobe.d/nvidia.conf
      mode: '0644'
      content: |-
        options nvidia_drm modeset=1
    - path: etc/mkinitcpio.conf.d/nvidia.conf
      mode: '0644'
      content: |-
        MODULES+=(nvidia nvidia_modeset nvidia_uvm nvidia_drm)
  support_url: https://wiki.archlinux.org/title/NVIDIA
  messages:
    en:
      n1x: "NVIDIA N1x platform detected; GPU driver policy is handled by the platform setup."
      unsupported: "No compatible driver for this NVIDIA GPU. See: {support_url}"
    it:
      n1x: "Piattaforma NVIDIA N1x rilevata; il driver GPU è gestito dalla configurazione della piattaforma."
      unsupported: "Nessun driver compatibile per questa GPU NVIDIA. Consulta: {support_url}"
tuxedo_backlight_setup:
  vendor_file: /sys/class/dmi/id/sys_vendor
  vendor_pattern: '(TUXEDO|Slimbook)'
  package_command: [arch-pkg-add]
  package: tuxedo-drivers-nocompatcheck-dkms
  blacklist_file: /etc/modprobe.d/blacklist-clevo-xsm-wmi.conf
  blacklist_content: "blacklist clevo_xsm_wmi\n"
  mode: '0644'
  module_glob: /lib/modules/*/extra/clevo-xsm-wmi.ko
  ownership_command: [pacman, -Qo]
  ownership_environment: {LC_ALL: C}
  unowned_pattern: '^error: No package owns '
qualcomm_initramfs:
  platform_check: [arch-hw-aarch64-qualcomm]
  directory_environment: ARCH_QUALCOMM_MKINITCPIO_DIR
  directory_default: /etc/mkinitcpio.conf.d
  filename: qualcomm-platform.conf
  mode: '0644'
  content: |-
    # Generated by os for Qualcomm Snapdragon devices.
    # Pin control, interconnect, PMIC and bus drivers of the X1 chips. Arch Linux
    # ARM's kernel builds them in. A kernel that builds them as modules needs them
    # named here, since mkinitcpio's hooks only pick storage, input and display
    # drivers. The ? skips one that a kernel does not have.
    MODULES+=(pinctrl-x1e80100? qnoc-x1e80100? spmi-pmic-arb? pinctrl-spmi-gpio? i2c-qcom-geni?
      reset-gpio? gpio-shared-proxy? qcom_hwspinlock? smem? smp2p? socinfo? nvmem_qfprom?
      nvmem_qcom-spmi-sdam? qcom-cpucp-mbox? pci-pwrctrl-pwrseq? pwrseq-qcom-wcn? dwc3-qcom?
      rtc-pm8xxx? qcom-pon? pm8941-pwrkey? icc-bwmon? qcom_tsens? qcom-spmi-temp-alarm?)
qualcomm_firmware_setup:
  platform_check: [arch-hw-aarch64-qualcomm]
  package_command: [arch-pkg-add]
  packages: [linux-firmware-qcom, qcom-firmware-extract]
  install_command: [qcom-firmware-extract, --install, --no-rebuild]
  missing_firmware_command: [qcom-firmware-extract, --list-missing]
  root_source_command: [findmnt, -no, SOURCE, --nofsroot, /]
  root_transport_command: [lsblk, -sno, TRAN]
  usb_transport_pattern: '^usb$'
  inspection_failure_disables_dsp: true
  adsp_missing_pattern: adsp
  directory_environment: ARCH_QUALCOMM_MODPROBE_DIR
  directory_default: /etc/modprobe.d
  filename: qualcomm-adsp-nofw.conf
  mode: '0644'
  usb_blacklist_content: |-
    # Generated by os for Qualcomm Snapdragon devices.
    # Keep the DSP driver off while the root disk is attached over USB.
    blacklist qcom_q6v5_pas
  missing_blacklist_content: |-
    # Generated by os for Qualcomm Snapdragon devices.
    # Keep the DSP driver off until its signed firmware can be verified.
    blacklist qcom_q6v5_pas
