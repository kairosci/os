steps:
  - src/python/installer/system_setup/chromium_preferences.py
  - root: arch_install
    path: config/browser-policy.sh
  - src/python/installer/system_setup/lockout_limit.py
  - src/python/installer/system_setup/lockscreen.py
  - src/python/installer/system_setup/powerprofilesctl_shebang.py
  - src/python/installer/system_setup/ssh_command_path.py
  - src/python/installer/system_setup/ssh_keepalive.py
  - src/python/installer/system_setup/locale_setup.py
  - src/python/installer/system_setup/language_setup.py
  - src/python/installer/system_setup/systemd_boot_snapshots.py
  - src/python/installer/system_setup/snapper_setup.py
  - src/python/installer/system_setup/systemd_boot_kernel.py
  - src/python/installer/system_setup/enable_services.py
  - src/python/installer/system_setup/firewall.py
  - src/python/installer/system_setup/branding.py
messages:
  en:
    starting: "Starting: {step}"
    completed: "Completed: {step}"
    failed: "Failed: {step} (exit code: {status})"
  it:
    starting: "Avvio: {step}"
    completed: "Completato: {step}"
    failed: "Non riuscito: {step} (codice di uscita: {status})"
lockscreen:
  command: ["{arch_path}/src/commands/arch-apply-lock"]

chromium_preferences:
  destination: /usr/lib/chromium/initial_preferences
  mode: 420
  content: |-
    {"distribution":{"require_eula":false},"browser":{"theme":{"color_scheme":0,"color_scheme2":0}}}

powerprofilesctl_shebang:
  file: /usr/bin/powerprofilesctl
  match_pattern: '^[^\n]*env python3[^\n]*$'
  replacement: '#!/bin/python3'

ssh_keepalive:
  path: /etc/ssh/ssh_config.d/20-arch-keepalive.conf
  directory_mode: '0755'
  file_mode: '0644'
  content: |-
    # os: notice dropped connections quickly instead of hanging until TCP
    # times out. Settings in ~/.ssh/config take precedence over these defaults.
    Host *
      ServerAliveInterval 15
      ServerAliveCountMax 3
      ConnectTimeout 10

ssh_command_path:
  file: /etc/security/pam_env.conf
  path_pattern: '^PATH\s'
  file_mode: '0644'
  append_content: |-

    # os: provide user-level tool paths to SSH commands and other non-shell logins.
    PATH DEFAULT=/usr/local/sbin:/usr/local/bin:/usr/bin:@{HOME}/.local/share/mise/shims:@{HOME}/.local/bin

service_commands:
  # Enable or mask services only. A reboot follows installation, so daemons must not start in the ISO session.
  commands:
    - [systemctl, enable, cups.service]
    - [systemctl, enable, avahi-daemon.service]
    - [systemctl, enable, linux-modules-cleanup.service]
    - [systemctl, enable, docker.socket]
    - [systemctl, enable, systemd-resolved.service]
    - [systemctl, enable, NetworkManager.service]
    - [systemctl, mask, NetworkManager-wait-online.service]
    - [systemctl, enable, power-profiles-daemon.service]
    - [systemctl, enable, sddm.service]
    - [systemctl, enable, systemd-oomd.service]

locale_setup:
  locale_conf_environment: ARCH_LOCALE_CONF
  locale_conf_default: /etc/locale.conf
  locale_gen_environment: ARCH_LOCALE_GEN
  locale_gen_default: /etc/locale.gen
  language_file_environment: ARCH_LANGUAGE_MARKER
  language_file_default: /etc/arch/language
  default_language: en
  target_locale: en_US.UTF-8
  target_locale_pattern: '^en_US\.UTF-?8'
  target_locale_gen_line: 'en_US.UTF-8 UTF-8'
  commented_locale_pattern: '^#en_US\.UTF-8'
  locale_command: [locale, -a]
  locale_gen_command: [locale-gen]
  stock_values: [C, POSIX]
  mode: '0644'
  messages:
    en:
      leaving: 'Leaving the locale as {locale}'
      setting: 'Setting up locale ({locale})...'
      set: 'Locale set to {locale}'
    it:
      leaving: 'La locale resta {locale}'
      setting: 'Configurazione della locale ({locale})...'
      set: 'Locale impostata su {locale}'

language_setup:
  marker_environment: ARCH_LANGUAGE_MARKER
  marker_default: /etc/arch/language
  fallback_marker: /etc/arch/language
  locales_file_environment: ARCH_LOCALES_JSON
  locales_file_default: default/i18n/locales.json
  code_pattern: '^[a-z]{2,3}(-[A-Z]{2})?$'
  language_environment: LANG
  default_language: en
  generator_command: ['{arch_path}/src/commands/arch-locale-generate']
  messages:
    en:
      invalid: 'Ignoring an invalid language in {marker}: {code}'
    it:
      invalid: 'Lingua non valida ignorata in {marker}: {code}'
