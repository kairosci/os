lockscreen:
  command: ["{arch_path}/src/cli/arch-apply-lock"]

chromium_preferences:
  destination: /usr/lib/chromium/initial_preferences
  mode: 420
  content: |-
    {"distribution":{"require_eula":false},"browser":{"theme":{"color_scheme":0,"color_scheme2":0}}}

powerprofilesctl_shebang:
  file: /usr/bin/powerprofilesctl
  match_pattern: '^[^\n]*env python3[^\n]*$'
  replacement: '#!/bin/python3'

ssh_keepalive:
  path: /etc/ssh/ssh_config.d/20-arch-keepalive.conf
  directory_mode: '0755'
  file_mode: '0644'
  content: |-
    # os: notice dropped connections quickly instead of hanging until TCP
    # times out. Settings in ~/.ssh/config take precedence over these defaults.
    Host *
      ServerAliveInterval 15
      ServerAliveCountMax 3
      ConnectTimeout 10
