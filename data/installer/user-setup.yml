steps:
  - setup/theme.py
  - setup/terminal.py
  - setup/chromium_extensions.py
  - setup/git.py
  - setup/xcompose.py
  - setup/language.py
  - setup/input_method.py
  - setup/work_directories.py
  - setup/video_decode.py
  - setup/qualcomm_camera.py
  - setup/nouveau_cursor.py
  - setup/vm.py
  - setup/default_keyring.py
  - setup/mise.py
  - setup/platform.py

language:
  preset_file: /etc/arch/language
  default_language: en
  command: "{ap}/src/arch/commands/arch-language"
  arguments: [seed]
  messages:
    en:
      failure: "Could not set the preset language {code}"
    it:
      failure: "Impossibile impostare la lingua predefinita {code}"

input_method:
  command: [arch-input-method, configure, --seed]
terminal:
  source: assets/applications/org.arch.terminal.desktop
  applications_directory: .local/share/applications
  target: org.arch.terminal.desktop
  obsolete_pattern: '*.terminal.desktop'
  mode: '0644'
git_identity:
  command: [git, config, --global]
  values:
    - environment: ARCH_USER_NAME
      key: user.name
    - environment: ARCH_USER_EMAIL
      key: user.email
xcompose:
  path: .XCompose
  user_name_environment: ARCH_USER_NAME
  user_email_environment: ARCH_USER_EMAIL
  template: |-
    # Run archctl restart xcompose to apply changes

    # Include fast emoji access
    include "$ap/default/xcompose"

    # Identification
    <Multi_key> <space> <n> : "$user_name"
    <Multi_key> <space> <e> : "$user_email"
  messages:
    en:
      invalid_identity: "Git identity values for XCompose must be single-line text."
    it:
      invalid_identity: "I valori di identità per XCompose devono essere su una sola riga."
chromium_extensions:
  commands:
    - [archctl, install, chromium, copy-url]
    - [archctl, install, chromium, yt-dlp]
video_decode:
  command: [archctl, install, video, decode]
work_directories:
  directories:
    - Work
    - Work/tries
default_keyring:
  directory: .local/share/keyrings
  directory_mode: '0700'
  keyring_file: Default_keyring.keyring
  keyring_mode: '0600'
  keyring_content: |-
    [keyring]
    display-name=Default keyring
    ctime={ctime}
    mtime=0
    lock-on-idle=false
    lock-after=false
  default_file: default
  default_mode: '0644'
  default_content: Default_keyring
  messages:
    en:
      setup_failed: "Could not safely set up the default keyring."
    it:
      setup_failed: "Impossibile configurare in sicurezza il portachiavi predefinito."
platform_setup:
  image_root_environment: ARCH_IMAGE_ROOT
  image_marker: var/lib/arch/image/target
  command: [arch-lifecycle-dispatch, setup-user]
  messages:
    en:
      image_deferred: "Image build: the platform's user setup waits for first run on the machine"
    it:
      image_deferred: "Creazione immagine: la configurazione utente della piattaforma attende il primo avvio sulla macchina"
mise_setup:
  commands:
    - [mise, reshim, --system]
    - [mise, reshim]
theme_setup:
  directory: .config/arch/themes
  selected_theme_file: .local/state/arch/current/theme.name
  context_environment: ARCH_SETUP_CONTEXT
  runtime_context: runtime
  default_theme: Cosmic
  set_command: [arch-theme-set]
  headless_environment: {ARCH_THEME_HEADLESS: '1'}
  chromium_lock: .config/chromium/SingletonLock
  activation_commands:
    - [arch-theme-set-pi, --activate]
    - [arch-theme-set-fcitx5, --activate]
  icon_source: /usr/share/icons/Cosmic/index.theme
  icon_directory: .local/share/icons/Cosmic
  icon_filename: index.theme
  icon_pattern: '^Inherits=.*'
  icon_replacement: Inherits=breeze-dark
  icon_mode: '0644'
  btop_directory: .config/btop/themes
  btop_target: .local/state/arch/current/theme/btop.theme
  btop_link: current.theme
nouveau_cursor_setup:
  nvidia_config_environment: ARCH_NVIDIA_MODPROBE_CONFIG
  nvidia_config_default: /etc/modprobe.d/nvidia.conf
  command_check: [archctl, cmd, present, lspci]
  driver_command: [lspci, -k]
  driver_environment: {LC_ALL: C}
  driver_pattern: 'Kernel driver in use: nouveau'
  config_file: .config/hypr/looknfeel.lua
  existing_setting: no_hardware_cursors
  setting: |-

    -- nouveau does not display the hardware cursor plane on many older NVIDIA GPUs,
    -- leaving the pointer invisible on the physical display. Render it in software.
    hl.config({
      cursor = {
        no_hardware_cursors = true,
      },
    })
  messages:
    en:
      enabled: "Detected nouveau driver. Forcing software cursors so the mouse pointer stays visible."
    it:
      enabled: "Driver nouveau rilevato. Attivo il cursore software per mantenere visibile il puntatore."
vm_setup:
  predicate: [archctl, hw, vm]
  files:
    - [default/hypr/toggles/no-animations.lua, .local/state/arch/toggles/hypr/no-animations.lua]
    - [default/hypr/toggles/window-opaque.lua, .local/state/arch/toggles/hypr/window-opaque.lua]
  messages:
    en:
      detected: "Detected a virtual machine. Turning off animations and transparency."
    it:
      detected: "Macchina virtuale rilevata. Disattivo animazioni e trasparenze."
qualcomm_camera_setup:
  command: [arch-install-camera]
