lockout_limit:
  system_auth:
    path: /etc/pam.d/system-auth
    rules:
      - name: preauthentication lockout rule
        pattern: '^(auth\s+required\s+pam_faillock\.so)\s+preauth.*$'
        replacement: '\1 preauth silent deny=10 unlock_time=120'
      - name: authentication failure lockout rule
        pattern: '^(auth\s+\[default=die\]\s+pam_faillock\.so)\s+authfail.*$'
        replacement: '\1 authfail deny=10 unlock_time=120'
  sddm_autologin:
    path: /etc/pam.d/sddm-autologin
    remove_patterns:
      - 'pam_faillock\.so preauth'
      - 'pam_faillock\.so authsucc'
    insert_after_pattern: 'auth.*pam_permit\.so'
    insert_line: 'auth        required    pam_faillock.so authsucc'
systemd_boot_snapshots:
  helper: src/cli/arch-hw-x86
  boot_entry:
    environment_override: ARCH_SYSTEMD_BOOT_ESP
    default_esp: /boot
    relative_path: EFI/systemd/systemd-bootx64.efi
  plugin:
    source: src/python/installer/boot/systemd_boot_snapper_plugin.py
    settings_source: data/installer/systemd-boot-snapper-plugin.yml
    settings_suffix: .yml
    settings_mode: '0644'
    target_environment: ARCH_SYSTEMD_BOOT_PLUGIN_TARGET
    target: /usr/lib/snapper/plugins/10-arch-systemd-boot
    directory_mode: '0755'
    mode: '0755'
  legacy_plugin:
    path: /usr/lib/snapper/plugins/10-limine-snapper-sync
  disable_units:
    - systemctl
    - disable
    - --now
    - limine-snapper-sync.service
    - arch-snapshot-entries.path
    - arch-snapshot-entries.service
  remove_files:
    - /etc/systemd/system/arch-snapshot-entries.path
    - /etc/systemd/system/arch-snapshot-entries.service
    - /usr/local/libexec/arch-sync-systemd-boot-snapshots
  reload_units:
    - systemctl
    - daemon-reload
