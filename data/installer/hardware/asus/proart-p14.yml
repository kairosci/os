hardware_check: [arch-hw-match, H7407BA]
speakers:
  install_packages: [arch-pkg-add, asus-proart-p14-speaker-firmware]
touchpad:
  target: /etc/libinput/local-overrides.quirks
  section_header: '[ASUS ProArt P14 Touchpad]'
  mode: '0644'
  content: |

    [ASUS ProArt P14 Touchpad]
    MatchBus=i2c
    MatchUdevType=touchpad
    MatchVendor=0x093A
    MatchProduct=0x4F02
    MatchDMIModalias=dmi:*svnASUS*:pn*H7407BA*
    AttrInputProp=+INPUT_PROP_PRESSUREPAD
statuses: {complete: 0, failed: 1}
