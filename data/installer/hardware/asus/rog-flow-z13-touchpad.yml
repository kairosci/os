hardware_checks:
  - [arch-hw-asus-rog]
  - [arch-hw-match, GZ302]
install_file: [sudo, install, -Dm644]
target: /etc/udev/rules.d/99-arch-asus-z13-touchpad.rules
content: |
  ACTION=="add|change", KERNEL=="event*", ATTRS{idVendor}=="0b05", ATTRS{idProduct}=="1a30", ENV{ID_INPUT_TOUCHPAD}=="1", ENV{ID_INPUT_TOUCHPAD_INTEGRATION}="internal"
statuses: {complete: 0}
