hardware_check: [arch-hw-elgato-camlink-4k]
install_packages: [arch-pkg-add, v4l2loopback-dkms, v4l2loopback-utils, v4l2-relayd]
install_file: [sudo, install, -Dm644]
files:
  - source: default/udev/elgato-camlink-4k.rules
    target: /etc/udev/rules.d/71-elgato-camlink-4k.rules
  - source: default/v4l2-relayd/camlink.conf
    target: /etc/v4l2-relayd.d/camlink.conf
  - source: default/systemd/system/camlink-4k-loopback.service
    target: /etc/systemd/system/camlink-4k-loopback.service
  - source: default/systemd/system/v4l2-relayd@camlink.service.d/camlink.conf
    target: /etc/systemd/system/v4l2-relayd@camlink.service.d/camlink.conf
modprobe_dropin:
  target: /etc/modprobe.d/v4l2loopback-exclusive-caps.conf
  content: "options v4l2loopback exclusive_caps=1\n"
statuses: {complete: 0}
