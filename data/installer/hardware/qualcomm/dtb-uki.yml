hardware_check: [arch-hw-aarch64-qualcomm]
install_packages: [arch-pkg-add, systemd-ukify]
dtb_root_environment: ARCH_QUALCOMM_DTB_ROOT
dtb_root_default: /boot/dtbs
dtb_subdirectory: qcom
kernel_dtb_glob: linux*/qcom
dtb_directory_environment: ARCH_QUALCOMM_DTB_DIR
uki_config_environment: ARCH_QUALCOMM_UKI_CONFIG
uki_config_default: /etc/kernel/uki.conf
dtb_patterns: [x1*.dtb, hamoa*.dtb, glymur*.dtb, sc8280xp*.dtb]
excluded_suffix: -el2.dtb
managed_begin: "# BEGIN ARCH QUALCOMM DEVICE TREES"
managed_end: "# END ARCH QUALCOMM DEVICE TREES"
generated_comments:
  - "# Generated by os for Qualcomm Snapdragon devices."
  - "# systemd-stub selects a device tree from SMBIOS data."
  - "# After a kernel update adds new boards, rerun 'arch apply hardware'"
  - "# and rebuild the UKI with 'sudo limine-mkinitcpio'."
uki_key: DeviceTreeAuto
new_file_mode: "0644"
rebuild_environment: ARCH_IMAGE_BOOT_REBUILD
messages:
  en:
    no_trees: "No Windows-on-ARM device trees under {directory}; the UKI gets no .dtbauto sections"
    listed_trees: "Listed {count} device trees in {path}"
  it:
    no_trees: "Nessun device tree Windows-on-ARM in {directory}; l'UKI non conterrà sezioni .dtbauto"
    listed_trees: "Elencati {count} device tree in {path}"
statuses: {complete: 0}
