pci_command: [lspci, -nn]
pci_pattern: '106b:180[12]'
install_packages:
  - arch-pkg-add
  - linux-t2
  - linux-t2-headers
  - apple-t2-audio-config
  - apple-bcm-firmware-fetcher
  - t2fanrd
enable_service: [systemctl, enable, t2fanrd.service]
mode: '0644'
files:
  - target: /etc/modules-load.d/t2.conf
    content: "t2bce_vhci\nhci_bcm4377\n"
  - target: /etc/mkinitcpio.conf.d/apple-t2.conf
    content: "MODULES+=(t2bce_vhci usbhid hid_apple hid_generic xhci_pci xhci_hcd)\n"
  - target: /etc/limine-entry-tool.d/t2-mac.conf
    content: |
      # Generated by os installer for T2 Mac support
      KERNEL_CMDLINE[default]+=" intel_iommu=on iommu=pt pm_async=off mem_sleep_default=deep"
  - target: /etc/t2fand.conf
    content: |
      [Fan1]
      low_temp=55
      high_temp=75
      speed_curve=linear
      always_full_speed=false

      [Fan2]
      low_temp=55
      high_temp=75
      speed_curve=linear
      always_full_speed=false
statuses: {complete: 0}
