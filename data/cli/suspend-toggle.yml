commands:
  set_state: [archctl, toggle, set]
  localize: [arch-i18n]
  notify: [archctl, notification, send, -g]
values:
  flag_name: suspend-off
  toggle_action: toggle
  notification_glyph: 󰒲
  notification_keys:
    disabled: suspend.removedFromMenu
    enabled: suspend.availableInMenu
  sleep_disabled_key: suspend.turnedOffOnMachine
limits:
  command_timeout_seconds: 5
  cleanup_timeout_seconds: 1
  maximum_output_bytes: 4096
  read_chunk_bytes: 1024
messages:
  usage: 'Usage: archctl toggle suspend'
  command_error: 'Could not change suspend availability'
statuses:
  invalid_arguments: 2
  command_error: 1
  success: 0
