default_language: en
client_command: [hyprctl, clients, -j]
fields:
  class: class
  history: focusHistoryID
  address: address
dispatcher_commands:
  - [hyprctl, dispatch, 'hl.dsp.focus({ window = "address:{address}" })']
  - [hyprctl, dispatch, focuswindow, 'address:{address}']
exit_codes:
  usage: 1
  no_match: 1
messages:
  en:
    usage: 'Usage: arch-hyprland-focus-app <app-name>'
  it:
    usage: 'Uso: arch-hyprland-focus-app <nome-app>'
