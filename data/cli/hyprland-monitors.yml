commands:
  focused:
    command: [hyprctl, monitors, -j]
    selected_field: focused
    selected_value: true
  laptop:
    command: [hyprctl, monitors, all, -j]
    name_pattern: "^(eDP|LVDS|DSI)-"
    first_match: true
apple:
  name_field: name
  focused_field: focused
  focused_value: true
  make_field: make
  make: Apple Computer Inc
  model_field: model
  model_pattern: "StudioDisplay|ProDisplayXDR|Studio XDR"
query_timeout_seconds: 2
modeless:
  fields:
    disabled: disabled
    disabled_value: true
    dimensions: [width, height]
    no_mode_value: 0
  statuses:
    modeless: 0
    working: 1
    unknown: 2
output_field: name
exit_codes:
  invalid_json:
    focused: 4
    laptop: 0
