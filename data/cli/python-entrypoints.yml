entrypoints:
  - binary: arch-pkg-missing
    module: pkg/presence
    function: missing_main
    group: pkg
    name: missing
    summary: Check whether any of the named packages are missing
    hidden: 'true'
    pass_args: 'true'
  - binary: arch-pkg-aur-accessible
    module: pkg/aur_accessible
    function: main
    group: pkg
    name: aur accessible
    summary: Check whether the AUR is reachable for package updates
  - binary: arch-pkg-present
    module: pkg/presence
    function: present_main
    group: pkg
    name: present
    summary: Check whether all of the named packages are installed
    hidden: 'true'
    pass_args: 'true'
  - binary: arch-theme-extras
    module: theme/extras
    function: main
    group: theme
    name: extras
    summary: List the user-installed themes that came from a git clone
    examples: archctl theme extras
  - binary: arch-background-session-mark
    module: background/session_mark
    function: main
    group: background
    name: session mark
    summary: Mark the current graphical login as checked for a background intro
    hidden: "true"
  - binary: arch-battery-present
    module: battery/present
    function: main
    group: battery
    name: present
    summary: Returns true if a battery is present on the system.
  - binary: arch-battery-status
    module: battery/status
    function: main
    group: battery
    name: status
    summary: Returns a formatted battery status string with percentage and power draw/charge.
    args: "[--shell]"
  - binary: arch-channel-current
    module: channel/current
    function: channel_current_main
    group: channel
    name: current
    summary: Print the active Arch package channel
  - binary: arch-capture-webcam-list
    module: hardware/webcam
    function: list_devices_main
    group: capture
    name: webcam list
    summary: List webcam devices that support video capture
    hidden: 'true'
  - binary: arch-font-set
    module: font/set
    function: main
    group: font
    name: set
    summary: Set the system monospace font
    args: <font-name>
    examples: 'archctl font list | archctl font set "CaskaydiaMono Nerd Font"'
  - binary: arch-network-qr
    module: network/qr
    function: main
    group: network
    name: qr
    summary: Generate a Wi-Fi QR matrix for the shell
    args: "[--meta] [interface]"
  - binary: arch-notification-wait
    module: notification/wait
    function: main
    group: notification
    name: wait
    summary: Wait for the desktop notification server to accept notifications
    args: "[timeout-seconds]"
    hidden: "true"
  - binary: arch-notification-dismiss
    module: notification/dismiss
    function: main
    group: notification
    name: dismiss
    summary: Dismiss a notification by summary substring
    args: <summary>
    pass_args: 'true'
  - binary: arch-notification-send
    module: notification/send
    function: main
    group: notification
    name: send
    summary: Send a desktop notification
    args: '[--app-name <app-name>] [-g <glyph>] [-u <low|normal|critical>] [-i <icon>] [-t <ms>] [-r <id>] [-p] [--image <path-or-uri>] <headline> [description] [--exec <program> [args...]]'
    examples: 'archctl notification send "Reminder" "5 minutes are up"'
    pass_args: 'true'
  - binary: arch-notification-battery
    module: notification/battery
    function: main
    group: notification
    name: battery
    summary: Show the current battery status notification
    pass_args: 'true'
  - binary: arch-notification-battery-low
    module: notification/battery
    function: low_main
    group: notification
    name: battery low
    summary: Warn about low battery and run its hooks
    args: <percentage>
    hidden: 'true'
    pass_args: 'true'
  - binary: arch-notification-time
    module: notification/time
    function: main
    group: notification
    name: time
    summary: Show the current time and date notification
    pass_args: 'true'
  - binary: arch-notification-weather
    module: notification/weather
    function: main
    group: notification
    name: weather
    summary: Toggle the current weather panel
    pass_args: 'true'
  - binary: arch-power-present
    module: power/present
    function: main
    group: power
    name: present
    summary: Returns true if external power is connected.
  - binary: arch-snapshot
    module: snapshot/manage
    function: main
    group: snapshot
    name: ''
    summary: Create or restore system snapshots with Snapper
    args: <create|restore>
    pass_args: 'true'
    generate_launcher: 'false'
  - binary: arch-powerprofiles-list
    module: powerprofiles/list
    function: main
    group: powerprofiles
    name: list
    summary: List available power profiles
    args: '[--active-state]'
    pass_args: 'true'
  - binary: arch-powerprofiles-set
    module: powerprofiles/set
    function: main
    group: powerprofiles
    name: set
    summary: Apply and remember the AC or battery power profile
    args: '[autodetect|ac|battery] [power-saver|balanced|performance]'
    examples: 'archctl powerprofiles set ac balanced | archctl powerprofiles set autodetect'
    pass_args: 'true'
  - binary: arch-refresh-config
    module: refresh/config
    function: main
    group: refresh
    name: config
    summary: Restore a shipped user config with an automatic backup
    args: <config-path>
  - binary: arch-refresh-tmux
    module: refresh/actions
    function: tmux_main
    group: refresh
    name: tmux
    summary: Restore the default tmux config and restart tmux
    pass_args: 'true'
  - binary: arch-refresh-hyprsunset
    module: refresh/actions
    function: hyprsunset_main
    group: refresh
    name: hyprsunset
    summary: Restore the default hyprsunset config and restart hyprsunset
    pass_args: 'true'
  - binary: arch-sleep-disabled
    module: sleep/disabled
    function: main
    group: sleep
    name: disabled
    summary: Check whether Arch has turned off system sleep on this machine.
    hidden: "true"
  - binary: arch-tui-install
    module: tui/install
    function: main
    group: tui
    name: install
    summary: Create a tiled desktop launcher for a terminal UI app
    args: <name> <command> <icon-url-or-name>
  - binary: arch-update-available
    module: update/available
    function: main
    group: update
    name: available
    summary: Check whether system updates are available
  - binary: arch-update-requires-free-space
    module: update/space_guard
    function: main
    group: update
    name: requires free space
    summary: Check free disk space required for an update
    hidden: 'true'
    pass_args: 'true'
  - binary: arch-update-confirm
    module: update/confirm
    function: main
    group: update
    name: confirm
    summary: Prompt for confirmation before starting an update
  - binary: arch-update-status
    module: update/status
    function: main
    group: update
    name: status
    summary: Clear the shell update indicator after an update
    hidden: "true"
  - binary: arch-bluetooth-device
    module: bluetooth/control
    function: device_main
    group: bluetooth
    name: device
    summary: Control a Bluetooth device
    args: '[pair|connect|disconnect|forget] <address>'
    examples: archctl bluetooth device connect 00:11:22:33:44:55
    pass_args: 'true'
  - binary: arch-bluetooth-power
    module: bluetooth/control
    function: power_main
    group: bluetooth
    name: power
    summary: Turn Bluetooth on or off, remembered across reboots
    args: <on|off|toggle|is-on>
    pass_args: 'true'
  - binary: arch-cmd-missing
    module: command/presence
    function: missing_main
    group: cmd
    name: missing
    summary: Check whether any required commands are missing
  - binary: arch-cmd-present
    module: command/presence
    function: present_main
    group: cmd
    name: present
    summary: Check whether all required commands are available
  - binary: arch-done
    module: done/manager
    function: main
    group: done
    name: ''
    summary: Check or mark completed Arch setup tasks
    args: <check|mark|ensure> <name>
    hidden: 'true'
  - binary: arch-dev-ui-preview
    module: dev/ui_preview
    function: main
    group: dev
    name: ui preview
    summary: Open the Arch shell UI component gallery
    args: '[section]'
    examples: archctl dev ui preview button
    pass_args: 'true'
  - binary: arch-default-browser
    module: default/browser
    function: default_browser_main
    group: default
    name: browser
    summary: Set or show the default browser
    args: '[--install] [chromium|chrome|brave|brave-origin|edge|firefox|zen]'
    examples: archctl default browser | archctl default browser firefox
    pass_args: 'true'
    generate_launcher: 'false'
  - binary: arch-default-browser-desktop-id
    module: default/browser
    function: default_browser_desktop_id_main
    group: default
    name: browser desktop-id
    summary: Print the desktop entry ID of the current browser
    hidden: 'true'
    pass_args: 'true'
    generate_launcher: 'false'
  - binary: arch-default-dictation
    module: default/dictation
    function: default_dictation_main
    group: default
    name: dictation
    summary: Get or set the default dictation backend
    args: '[backend]'
    examples: archctl default dictation | archctl default dictation superwhisper
    pass_args: 'true'
    generate_launcher: 'false'
  - binary: arch-default-editor
    module: default/editor
    function: default_editor_main
    group: default
    name: editor
    summary: Set the default editor used by Arch launchers
    args: '[--install] [editor]'
    examples: archctl default editor | archctl default editor helix
    pass_args: 'true'
    generate_launcher: 'false'
  - binary: arch-default-terminal
    module: default/terminal
    function: default_terminal_main
    group: default
    name: terminal
    summary: Set the default terminal used by xdg-terminal-exec
    args: '[--install] [terminal]'
    examples: archctl default terminal | archctl default terminal kitty
    pass_args: 'true'
    generate_launcher: 'false'
  - binary: arch-font-cjk
    module: font/catalog
    function: cjk_main
    group: font
    name: cjk
    summary: Show or set the glyph forms for Chinese, Japanese, and Korean text
    args: '[jp|kr|sc|tc|hk|default]'
    examples: archctl font cjk | archctl font cjk jp | archctl font cjk default
    pass_args: 'true'
  - binary: arch-font-current
    module: font/catalog
    function: current_main
    group: font
    name: current
    summary: Show current monospace font
    examples: archctl font current
  - binary: arch-font-list
    module: font/catalog
    function: list_main
    group: font
    name: list
    summary: List available monospace fonts
    examples: archctl font list | archctl font set "CaskaydiaMono Nerd Font"
  - binary: arch-hook
    module: hook/runner
    function: run_main
    group: hook
    name: ''
    summary: Run a named hook from ~/.config/arch/hooks/<name> and ~/.config/arch/hooks/<name>.d/.
    args: '[name] [args...]'
  - binary: arch-hook-install
    module: hook/runner
    function: install_main
    group: hook
    name: install
    summary: Install a hook into ~/.config/arch/hooks/<type>.d/
    args: <type> <file>
    examples: archctl hook install post-update ~/my-hook
  - binary: arch-hibernation-available
    module: hibernation/available
    function: main
    group: hibernation
    name: available
    summary: Check whether the system can hibernate
    hidden: 'true'
  - binary: arch-hw-aarch64
    module: hardware/architecture
    function: aarch64_main
    group: hw
    name: aarch64
    summary: Detect whether the CPU is aarch64 (every ARM machine, Apple Silicon included).
  - binary: arch-hw-intel
    module: hardware/intel
    function: intel_main
    group: hw
    name: intel
    summary: Detect whether the computer has an Intel CPU.

  - binary: arch-hw-intel-ptl
    module: hardware/intel
    function: intel_ptl_main
    group: hw
    name: intel ptl
    summary: Detect whether the computer has an Intel Panther Lake GPU.
  - binary: arch-hw-intel-sof
    module: hardware/intel
    function: intel_sof_main
    group: hw
    name: intel sof
    summary: Detect an Intel SOF-capable audio DSP.

  - binary: arch-hw-external-monitors
    module: hardware/misc
    function: external_monitors_main
    group: hw
    name: external monitors
    summary: Detect whether an external monitor is connected
    hidden: 'true'
  - binary: arch-hw-touchscreen
    module: hardware/misc
    function: touchscreen_main
    group: hw
    name: touchscreen
    summary: Print the detected Hyprland touchscreen or tablet device name
  - binary: arch-hw-vulkan
    module: hardware/misc
    function: vulkan_main
    group: hw
    name: vulkan
    summary: Detect whether Vulkan is available.
  - binary: arch-hw-hybrid-gpu
    module: hardware/hybrid_gpu
    function: main
    group: hw
    name: hybrid gpu
    summary: Detect whether the system has an active hybrid GPU configuration

  - binary: arch-hw-vm
    module: hardware/virtualization
    function: main
    group: hw
    name: vm
    summary: Returns true when running in a virtual machine.
  - binary: arch-hw-clamshell
    module: hardware/clamshell
    function: main
    group: hw
    name: clamshell
    summary: Returns true when clamshell mode is active
    hidden: "true"
  - binary: arch-hw-laptop
    module: hardware/laptop
    function: laptop_main
    group: hw
    name: laptop
    summary: Returns true when running on a laptop (has a lid or laptop chassis).
    hidden: "true"
  - binary: arch-hw-match
    module: hardware/match
    function: match_main
    group: hw
    name: match
    summary: Match against the computer's DMI product name or product family (case-insensitive).
    args: <pattern>
    pass_args: "true"
  - binary: arch-hw-match-device-tree
    module: hardware/match_device_tree
    function: match_device_tree_main
    group: hw
    name: match device tree
    summary: Match against the device tree's top-level compatible strings (whole string, case-insensitive).
    args: <compatibles...>
    pass_args: "true"
  - binary: arch-hw-fingerprint
    module: hardware/fingerprint
    function: fingerprint_main
    group: hw
    name: fingerprint
    summary: Returns true when a fingerprint reader is present
    hidden: "true"
  - binary: arch-hw-display
    module: hardware/display
    function: display_main
    group: hw
    name: display
    summary: Print the most likely display backlight device
  - binary: arch-hw-recover-internal-monitor
    module: hardware/monitor_recovery
    function: recover_internal_monitor_main
    group: hw
    name: recover internal monitor
    summary: Clear the disabled internal-monitor toggle when no external display is connected
  - binary: arch-hw-nvidia
    module: hardware/nvidia
    function: main
    group: hw
    name: nvidia
    summary: Detect whether the computer has an NVIDIA GPU.
  - binary: arch-hw-nvidia-display
    module: hardware/nvidia
    function: nvidia_display_main
    group: hw
    name: nvidia display
    summary: Detect whether NVIDIA drives the display instead of a hybrid iGPU
  - binary: arch-hw-nvidia-gsp
    module: hardware/nvidia
    function: gsp_main
    group: hw
    name: nvidia gsp
    summary: Detect whether an NVIDIA GPU has GSP firmware
    hidden: 'true'
  - binary: arch-hw-nvidia-without-gsp
    module: hardware/nvidia
    function: without_gsp_main
    group: hw
    name: nvidia without gsp
    summary: Detect an NVIDIA GPU without GSP firmware
    hidden: 'true'
  - binary: arch-hw-touchpad
    module: hardware/touchpad
    function: touchpad_main
    group: hw
    name: touchpad
    summary: Print the detected Hyprland touchpad or trackpad device name
  - binary: arch-hw-webcam
    module: hardware/webcam
    function: main
    group: hw
    name: webcam
    summary: Check whether a webcam is available

  - binary: arch-hw-x86
    module: hardware/architecture
    function: x86_main
    group: hw
    name: x86
    summary: Detect whether the CPU is x86_64.
  - binary: arch-hyprland-focus-app
    module: hyprland/focus
    function: main
    group: hyprland
    name: focus app
    summary: Focus a Hyprland window by application identity
    args: <app-name>
    examples: archctl hyprland focus app Slack
  - binary: arch-hyprland-monitor-focused
    module: hyprland/monitors
    function: focused_main
    group: hyprland
    name: monitor focused
    summary: Print the name of the currently focused Hyprland monitor.
  - binary: arch-hyprland-monitor-focused-apple
    module: hyprland/monitors
    function: apple_main
    group: hyprland
    name: monitor focused apple
    summary: Return success if the focused or named Hyprland monitor is an Apple display.
    args: "[monitor]"
    pass_args: 'true'
  - binary: arch-hyprland-monitor-external-active
    module: hyprland/monitors
    function: external_active_main
    group: hyprland
    name: monitor external active
    summary: Check whether Hyprland has an active external monitor.
    hidden: 'true'
  - binary: arch-hyprland-monitor-laptop
    module: hyprland/monitors
    function: laptop_main
    group: hyprland
    name: monitor laptop
    summary: Print the name of the built-in laptop display, including disabled outputs.
  - binary: arch-hyprland-monitor-modeless
    module: hyprland/monitors
    function: modeless_main
    group: hyprland
    name: monitor modeless
    summary: Check whether Hyprland has an enabled monitor with no mode.
    hidden: 'true'
  - binary: arch-hyprland-session-locked
    module: hyprland/session_locked
    function: main
    group: hyprland
    name: session locked
    summary: Check whether the compositor holds a session lock
    hidden: 'true'
  - binary: arch-hyprland-toggle
    module: hyprland/toggle
    function: set_main
    group: hyprland
    name: toggle
    summary: Enable, disable, or toggle a persistent Hyprland setting
    args: <flag-name> [on|off|toggle]
    examples: archctl hyprland toggle no-animations on
    pass_args: 'true'
  - binary: arch-hyprland-toggle-enabled
    module: hyprland/toggle
    function: enabled_main
    group: hyprland
    name: toggle enabled
    summary: Check whether a Hyprland toggle is enabled
    args: <flag-name>
    pass_args: 'true'
  - binary: arch-hyprland-toggle-disabled
    module: hyprland/toggle
    function: disabled_main
    group: hyprland
    name: toggle disabled
    summary: Check whether a Hyprland toggle is disabled
    args: <flag-name>
    pass_args: 'true'
  - binary: arch-hyprland-window-single-square-aspect-toggle
    module: hyprland/toggle
    function: aspect_toggle_main
    group: hyprland
    name: window single square aspect toggle
    summary: Toggle the square aspect ratio for a single window
    pass_args: 'true'
  - binary: arch-hyprland-workspace-layout-current
    module: hyprland/workspace_layout
    function: workspace_layout_current_main
    group: hyprland
    name: workspace layout current
    summary: "Print a workspace layout: tiling or scrolling"
    args: "[workspace-id]"
    pass_args: 'true'
  - binary: arch-hyprland-workspace-layout-default
    module: hyprland/workspace_layout
    function: workspace_layout_default_main
    group: hyprland
    name: workspace layout default
    summary: Set or show the default workspace layout
    args: "[tiling|scrolling]"
    examples: archctl hyprland workspace layout default scrolling
    generate_launcher: 'false'
    pass_args: 'true'
  - binary: arch-hyprland-workspace-layout-toggle
    module: hyprland/workspace_layout
    function: workspace_layout_toggle_main
    group: hyprland
    name: workspace layout toggle
    summary: Cycle the current workspace between tiling and scrolling
    args: '[back]'
    generate_launcher: 'false'
    pass_args: 'true'
  - binary: arch-restart-app
    module: restart/app
    function: restart_app_main
    group: restart
    name: app
    summary: Restart an application through the user session launcher
    args: <application-name> [application-args...]
    examples: archctl restart app firefox
    pass_args: 'true'
  - binary: arch-restart-bluetooth
    module: restart/bluetooth
    function: main
    group: restart
    name: bluetooth
    summary: Unblock Bluetooth and show the current radio block state
    pass_args: 'true'
  - binary: arch-restart-wifi
    module: restart/wifi
    function: main
    group: restart
    name: wifi
    summary: Unblock Wi-Fi, enable NetworkManager radio, and show its state
    pass_args: 'true'
  - binary: arch-restart-terminal
    module: restart/terminal
    function: main
    group: restart
    name: terminal
    summary: Refresh supported terminal emulators after config changes
    pass_args: 'true'
  - binary: arch-restart-trackpad
    module: restart/trackpad
    function: main
    group: restart
    name: trackpad
    summary: Reset the trackpad driver
    requires_sudo: 'true'
    pass_args: 'true'
  - binary: arch-install-editor-zed
    module: install/editor
    function: zed_main
    group: install
    name: editor zed
    summary: Install and launch Zed Editor
    examples: archctl install editor zed
  - binary: arch-install-editor-helix
    module: install/helix
    function: helix_main
    group: install
    name: editor helix
    summary: Install Helix and configure its Arch theme
    examples: archctl install editor helix
  - binary: arch-restart-btop
    module: restart/app
    function: restart_btop_main
    group: restart
    name: btop
    summary: Refresh the configuration of a running btop window
  - binary: arch-restart-helix
    module: restart/app
    function: restart_helix_main
    group: restart
    name: helix
    summary: Refresh the configuration of a running Helix editor
  - binary: arch-restart-tmux
    module: restart/app
    function: restart_tmux_main
    group: restart
    name: tmux
    summary: Reload the tmux configuration when a session is running
  - binary: arch-restart-hyprctl
    module: restart/hyprland
    function: main
    group: restart
    name: hyprctl
    summary: Reload hyprland configuration (used by the Arch theme switching).
  - binary: arch-restart-xcompose
    module: restart/xcompose
    function: main
    group: restart
    name: xcompose
    summary: Restart the XCompose input method service to apply compose key settings
  - binary: arch-restart-hyprsunset
    module: restart/app
    function: restart_hyprsunset_main
    group: restart
    name: hyprsunset
    summary: Restart the blue light filter service
    hidden: 'true'
  - binary: arch-state
    module: state/store
    function: main
    group: state
    name: ''
    summary: Manage persistent state files for Arch toggles and settings.
    args: <set|clear> <state-name-or-pattern>
    hidden: 'true'
  - binary: arch-toggle-enabled
    module: toggle/state
    function: enabled_main
    group: toggle
    name: enabled
    summary: Check whether an Arch toggle is enabled
    args: <flag-name>
    examples: archctl toggle enabled screensaver-off
    pass_args: 'true'
  - binary: arch-toggle
    module: toggle/state
    function: set_main
    group: toggle
    name: set
    summary: Enable, disable, or flip a persistent Arch toggle
    args: <flag-name> [toggle|on|off]
    examples: archctl toggle set screensaver-off off
    pass_args: 'true'
  - binary: arch-toggle-input-device
    module: toggle/input_device
    function: input_device_main
    group: toggle
    name: input device
    summary: Enable, disable, or toggle a touchpad or touchscreen
    args: <touchpad|touchscreen> [on|off|toggle]
    hidden: 'true'
    pass_args: 'true'
  - binary: arch-toggle-nightlight
    module: toggle/nightlight
    function: nightlight_main
    group: toggle
    name: nightlight
    summary: Toggle or inspect the nightlight screen temperature
    args: '[on|off|--status]'
    pass_args: 'true'
  - binary: arch-toggle-animations
    module: toggle/animations
    function: main
    group: toggle
    name: animations
    summary: Toggle desktop animations
    args: "[toggle|on|off]"
    examples: 'archctl toggle animations | archctl toggle animations off | archctl toggle animations on'
    pass_args: 'true'
  - binary: arch-toggle-bar
    module: toggle/bar
    function: main
    group: toggle
    name: bar
    summary: Toggle bar visibility
    args: '[on|off|toggle]'
    examples: 'archctl toggle bar | archctl toggle bar off | archctl toggle bar on'
    pass_args: 'true'
  - binary: arch-toggle-crash-capture
    module: toggle/crash_capture
    function: main
    group: toggle
    name: crash capture
    summary: Toggle crash capture notifications
    pass_args: 'true'
  - binary: arch-toggle-notification-silencing
    module: toggle/notification_silencing
    function: main
    group: toggle
    name: notifications
    summary: Toggle Do Not Disturb mode
    pass_args: 'true'
  - binary: arch-toggle-idle
    module: toggle/idle
    function: main
    group: toggle
    name: idle
    summary: Toggle Stay Awake and idle locking
    args: '[toggle|stay-awake|allow-idle|enabled|status]'
    examples: 'archctl toggle idle | archctl toggle idle stay-awake | archctl toggle idle status'
    pass_args: 'true'
  - binary: arch-toggle-hybrid-gpu
    module: toggle/hybrid_gpu
    function: main
    group: toggle
    name: hybrid gpu
    summary: Toggle dedicated vs integrated GPU mode on hybrid GPU laptops
    pass_args: 'true'
  - binary: arch-toggle-fullscreen-desktop
    module: toggle/fullscreen_desktop
    function: main
    group: toggle
    name: fullscreen desktop
    summary: Toggle fullscreen desktop mode for the bar and window gaps
    args: '[toggle|on|off]'
