entrypoints:
  - binary: arch-background-session-mark
    module: background/session_mark
    function: main
    group: background
    name: session mark
    summary: Mark the current graphical login as checked for a background intro
    hidden: "true"
  - binary: arch-battery-present
    module: battery/present
    function: main
    group: battery
    name: present
    summary: Returns true if a battery is present on the system.
  - binary: arch-battery-status
    module: battery/status
    function: main
    group: battery
    name: status
    summary: Returns a formatted battery status string with percentage and power draw/charge.
    args: "[--shell]"
  - binary: arch-channel-current
    module: channel/current
    function: channel_current_main
    group: channel
    name: current
    summary: Print the active Arch package channel
  - binary: arch-font-set
    module: font/set
    function: main
    group: font
    name: set
    summary: Set the system monospace font
    args: <font-name>
    examples: 'archctl font list | archctl font set "CaskaydiaMono Nerd Font"'
  - binary: arch-network-qr
    module: network/qr
    function: main
    group: network
    name: qr
    summary: Generate a Wi-Fi QR matrix for the shell
    args: "[--meta] [interface]"
  - binary: arch-notification-wait
    module: notification/wait
    function: main
    group: notification
    name: wait
    summary: Wait for the desktop notification server to accept notifications
    args: "[timeout-seconds]"
    hidden: "true"
  - binary: arch-power-present
    module: power/present
    function: main
    group: power
    name: present
    summary: Returns true if external power is connected.
  - binary: arch-refresh-config
    module: refresh/config
    function: main
    group: refresh
    name: config
    summary: Restore a shipped user config with an automatic backup
    args: <config-path>
  - binary: arch-sleep-disabled
    module: sleep/disabled
    function: main
    group: sleep
    name: disabled
    summary: Check whether Arch has turned off system sleep on this machine.
    hidden: "true"
  - binary: arch-tui-install
    module: tui/install
    function: main
    group: tui
    name: install
    summary: Create a tiled desktop launcher for a terminal UI app
    args: <name> <command> <icon-url-or-name>
  - binary: arch-update-available
    module: update/available
    function: main
    group: update
    name: available
    summary: Check whether system updates are available
  - binary: arch-update-confirm
    module: update/confirm
    function: main
    group: update
    name: confirm
    summary: Prompt for confirmation before starting an update
  - binary: arch-bluetooth-device
    module: bluetooth/control
    function: device_main
    group: bluetooth
    name: device
    summary: Control a Bluetooth device
    args: '[pair|connect|disconnect|forget] <address>'
    examples: archctl bluetooth device connect 00:11:22:33:44:55
    pass_args: 'true'
  - binary: arch-bluetooth-power
    module: bluetooth/control
    function: power_main
    group: bluetooth
    name: power
    summary: Turn Bluetooth on or off, remembered across reboots
    args: <on|off|toggle|is-on>
    pass_args: 'true'
  - binary: arch-cmd-missing
    module: command/presence
    function: missing_main
    group: cmd
    name: missing
    summary: Check whether any required commands are missing
  - binary: arch-cmd-present
    module: command/presence
    function: present_main
    group: cmd
    name: present
    summary: Check whether all required commands are available
  - binary: arch-done
    module: done/manager
    function: main
    group: done
    name: ''
    summary: Check or mark completed Arch setup tasks
    args: <check|mark|ensure> <name>
    hidden: 'true'
  - binary: arch-font-cjk
    module: font/catalog
    function: cjk_main
    group: font
    name: cjk
    summary: Show or set the glyph forms for Chinese, Japanese, and Korean text
    args: '[jp|kr|sc|tc|hk|default]'
    examples: archctl font cjk | archctl font cjk jp | archctl font cjk default
    pass_args: 'true'
  - binary: arch-font-current
    module: font/catalog
    function: current_main
    group: font
    name: current
    summary: Show current monospace font
    examples: archctl font current
  - binary: arch-font-list
    module: font/catalog
    function: list_main
    group: font
    name: list
    summary: List available monospace fonts
    examples: archctl font list | archctl font set "CaskaydiaMono Nerd Font"
  - binary: arch-hook
    module: hook/runner
    function: run_main
    group: hook
    name: ''
    summary: Run a named hook from ~/.config/arch/hooks/<name> and ~/.config/arch/hooks/<name>.d/.
    args: '[name] [args...]'
  - binary: arch-hook-install
    module: hook/runner
    function: install_main
    group: hook
    name: install
    summary: Install a hook into ~/.config/arch/hooks/<type>.d/
    args: <type> <file>
    examples: archctl hook install post-update ~/my-hook
  - binary: arch-hw-aarch64
    module: hardware/architecture
    function: aarch64_main
    group: hw
    name: aarch64
    summary: Detect whether the CPU is aarch64 (every ARM machine, Apple Silicon included).
  - binary: arch-hw-intel
    module: hardware/intel
    function: intel_main
    group: hw
    name: intel
    summary: Detect whether the computer has an Intel CPU.
  - binary: arch-hw-intel-ptl
    module: hardware/intel
    function: intel_ptl_main
    group: hw
    name: intel ptl
    summary: Detect whether the computer has an Intel Panther Lake GPU.
  - binary: arch-hw-intel-sof
    module: hardware/intel
    function: intel_sof_main
    group: hw
    name: intel sof
    summary: Detect an Intel SOF-capable audio DSP.
  - binary: arch-hw-external-monitors
    module: hardware/misc
    function: external_monitors_main
    group: hw
    name: external monitors
    summary: Detect whether an external monitor is connected
    hidden: 'true'
  - binary: arch-hw-touchscreen
    module: hardware/misc
    function: touchscreen_main
    group: hw
    name: touchscreen
    summary: Print the detected Hyprland touchscreen or tablet device name
  - binary: arch-hw-vulkan
    module: hardware/misc
    function: vulkan_main
    group: hw
    name: vulkan
    summary: Detect whether Vulkan is available.
  - binary: arch-hw-hybrid-gpu
    module: hardware/hybrid_gpu
    function: main
    group: hw
    name: hybrid gpu
    summary: Detect whether the system has an active hybrid GPU configuration
  - binary: arch-hw-vm
    module: hardware/virtualization
    function: main
    group: hw
    name: vm
    summary: Returns true when running in a virtual machine.
  - binary: arch-hw-clamshell
    module: hardware/clamshell
    function: main
    group: hw
    name: clamshell
    summary: Returns true when clamshell mode is active
    hidden: "true"
  - binary: arch-hw-laptop
    module: hardware/laptop
    function: laptop_main
    group: hw
    name: laptop
    summary: Returns true when running on a laptop (has a lid or laptop chassis).
    hidden: "true"
  - binary: arch-hw-match
    module: hardware/match
    function: match_main
    group: hw
    name: match
    summary: Match against the computer's DMI product name or product family (case-insensitive).
    args: <pattern>
    pass_args: "true"
  - binary: arch-hw-match-device-tree
    module: hardware/match_device_tree
    function: match_device_tree_main
    group: hw
    name: match device tree
    summary: Match against the device tree's top-level compatible strings (whole string, case-insensitive).
    args: <compatibles...>
    pass_args: "true"
  - binary: arch-hw-fingerprint
    module: hardware/fingerprint
    function: fingerprint_main
    group: hw
    name: fingerprint
    summary: Returns true when a fingerprint reader is present
    hidden: "true"
  - binary: arch-hw-display
    module: hardware/display
    function: display_main
    group: hw
    name: display
    summary: Print the most likely display backlight device
  - binary: arch-hw-recover-internal-monitor
    module: hardware/monitor_recovery
    function: recover_internal_monitor_main
    group: hw
    name: recover internal monitor
    summary: Clear the disabled internal-monitor toggle when no external display is connected
  - binary: arch-hw-nvidia
    module: hardware/nvidia
    function: main
    group: hw
    name: nvidia
    summary: Detect whether the computer has an NVIDIA GPU.
  - binary: arch-hw-nvidia-display
    module: hardware/nvidia
    function: nvidia_display_main
    group: hw
    name: nvidia display
    summary: Detect whether NVIDIA drives the display instead of a hybrid iGPU
  - binary: arch-hw-nvidia-gsp
    module: hardware/nvidia
    function: gsp_main
    group: hw
    name: nvidia gsp
    summary: Detect whether an NVIDIA GPU has GSP firmware
    hidden: 'true'
  - binary: arch-hw-nvidia-without-gsp
    module: hardware/nvidia
    function: without_gsp_main
    group: hw
    name: nvidia without gsp
    summary: Detect an NVIDIA GPU without GSP firmware
    hidden: 'true'
  - binary: arch-hw-touchpad
    module: hardware/touchpad
    function: touchpad_main
    group: hw
    name: touchpad
    summary: Print the detected Hyprland touchpad or trackpad device name
  - binary: arch-hw-webcam
    module: hardware/webcam
    function: main
    group: hw
    name: webcam
    summary: Check whether a webcam is available
  - binary: arch-hw-x86
    module: hardware/architecture
    function: x86_main
    group: hw
    name: x86
    summary: Detect whether the CPU is x86_64.
  - binary: arch-hyprland-focus-app
    module: hyprland/focus
    function: main
    group: hyprland
    name: focus app
    summary: Focus a Hyprland window by application identity
    args: <app-name>
    examples: archctl hyprland focus app Slack
  - binary: arch-hyprland-monitor-focused
    module: hyprland/monitors
    function: focused_main
    group: hyprland
    name: monitor focused
    summary: Print the name of the currently focused Hyprland monitor.
  - binary: arch-hyprland-monitor-laptop
    module: hyprland/monitors
    function: laptop_main
    group: hyprland
    name: monitor laptop
    summary: Print the name of the built-in laptop display, including disabled outputs.
  - binary: arch-hyprland-workspace-layout-current
    module: hyprland/workspace_layout
    function: workspace_layout_current_main
    group: hyprland
    name: workspace layout current
    summary: "Print a workspace layout: tiling or scrolling"
    args: "[workspace-id]"
    pass_args: 'true'
  - binary: arch-restart-hyprctl
    module: restart/hyprland
    function: main
    group: restart
    name: hyprctl
    summary: Reload hyprland configuration (used by the Arch theme switching).
  - binary: arch-state
    module: state/store
    function: main
    group: state
    name: ''
    summary: Manage persistent state files for Arch toggles and settings.
    args: <set|clear> <state-name-or-pattern>
    hidden: 'true'
  - binary: arch-theme-bg-current
    module: theme/info
    function: background_current_main
    group: theme
    name: bg current
    summary: Show current background
    examples: archctl theme bg current
  - binary: arch-theme-bg-next
    module: theme/info
    function: background_next_main
    group: theme
    name: bg next
    summary: Cycle to the next background for the current theme
    examples: archctl theme bg next
  - binary: arch-theme-bg-set
    module: theme/info
    function: background_set_main
    group: theme
    name: bg set
    summary: Set the current background image or video
    args: <path-to-media>
    examples: archctl theme bg set ~/Pictures/background.png
    pass_args: 'true'
  - binary: arch-theme-current
    module: theme/info
    function: theme_current_main
    group: theme
    name: current
    summary: Show current theme
    examples: archctl theme current
  - binary: arch-theme-dir
    module: theme/info
    function: theme_dir_main
    group: theme
    name: dir
    summary: Print the directory holding a theme, preferring a user-installed copy
    args: <theme-name>
    examples: archctl theme dir tokyo-night
    pass_args: 'true'
  - binary: arch-theme-list
    module: theme/info
    function: theme_list_main
    group: theme
    name: list
    summary: List available themes
    examples: archctl theme list | archctl theme set "Tokyo Night"
  - binary: arch-version
    module: version/info
    function: version_main
    group: version
    name: ''
    summary: Print the installed Arch version
  - binary: arch-version-branch
    module: version/info
    function: version_branch_main
    group: version
    name: branch
    summary: Print the active Arch dev-link git branch
    hidden: 'true'
  - binary: arch-version-channel
    module: version/info
    function: version_channel_main
    group: version
    name: channel
    summary: Print the active Arch mirror and package channel
  - binary: arch-version-pkgs
    module: version/packages
    function: main
    group: version
    name: pkgs
    summary: Print when system packages were last upgraded
