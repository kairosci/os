commands:
  hyprland_devices: [hyprctl, devices, -j]
paths:
  vulkan_icd_directory: /usr/share/vulkan/icd.d
patterns:
  vulkan_icd: "*.json"
fields:
  touch: touch
  tablets: tablets
  name: name
monitor_status:
  directory_environment: ARCH_DRM_PATH
  default_directory: /sys/class/drm
  status_glob: card*-*/status
  internal_connector_pattern: '-(eDP|LVDS|DSI)-[^/]+$'
  connected_value: connected
