commands:
  language: [arch-language, locale]
  timestamp: [date, +%s]
  date: [date, -d]
  translation: [arch-i18n, time.now]
  notification: [archctl, notification, send, -g, , -u, low]
formats:
  day_time: '+%A %H:%M'
  day_month_year: '+%d %B %Y'
  week_number: '+%V'
timeout_seconds: 5
statuses:
  success: 0
  failure: 1
messages:
  invalid_arguments: This command does not accept arguments.
  operation_error: Could not show the time notification
