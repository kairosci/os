paths:
  state_home_environment: XDG_STATE_HOME
  state_home_default: "{home}/.local/state"
  theme_name_file: "{state_home}/arch/current/theme.name"
  user_themes: "{home}/.config/arch/themes"
  bundled_themes: "{ap}/assets/themes"
  current_background: "{state_home}/arch/current/background"
  user_backgrounds: "{home}/.config/arch/backgrounds/{theme}"
  theme_backgrounds: "{state_home}/arch/current/theme/backgrounds"
  background_root: "{state_home}/arch/current/theme.name"
background_cycle:
  extensions: [.jpg, .jpeg, .png, .gif, .bmp, .webp, .mp4, .m4v, .mov, .webm, .mkv, .avi]
  commands:
    set_background: [arch-theme-bg-set]
    translate: [arch-i18n]
    notify: [arch-notification-send]
  no_background_message: theme.noBackground
  notification_timeout_option: -t
  notification_timeout: 2000
background_set:
  commands:
    shell: [arch-shell, -q, background, set]
  temporary_directory_prefix: .background-
  temporary_symlink_name: selected
background_name:
  extension_pattern: '\.[^.]+$'
  numeric_prefix_pattern: '^\d+-'
  word_initial_pattern: '\b(\w)'
  hyphen: '-'
  separator: ' '
theme_name:
  pattern: '(^|-)([a-z])'
  prefix_group: 1
  uppercase_group: 2
  hyphen: '-'
  separator: ' '
theme_id_pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*$'
messages:
  default_language: en
  supported_languages: [en, it]
  all_locale_environment: LC_ALL
  locale_environment: LC_MESSAGES
  fallback_environment: LANG
  locale_separators: ['.', '_', '@']
  usage:
    en: "Usage: archctl theme dir <theme-name>"
    it: "Uso: archctl theme dir <nome-tema>"
  background_set_usage:
    en: "Usage: arch-theme-bg-set <path-to-media>"
    it: "Uso: arch-theme-bg-set <percorso-media>"
  background_file_missing:
    en: "File does not exist: {path}"
    it: "Il file non esiste: {path}"
  unknown:
    en: Unknown
    it: Sconosciuto
