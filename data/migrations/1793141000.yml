paths:
  applications: .local/share/applications
  mime_files:
    - .config/mimeapps.list
    - .local/share/applications/mimeapps.list
  xdg_config_mime_file: [mimeapps, list]
launchers:
  - name: Basecamp.desktop
    content: |
      [Desktop Entry]
      Version=1.0
      Name=Basecamp
      Exec=arch-launch-webapp https://launchpad.37signals.com
      StartupWMClass=chrome-launchpad.37signals.com__-Default
      Terminal=false
      Type=Application
      Icon=basecamp
      StartupNotify=true
  - name: HEY.desktop
    content: |
      [Desktop Entry]
      Version=1.0
      Name=HEY
      Exec=arch-webapp-handler-hey %u
      Terminal=false
      Type=Application
      Icon=hey
      StartupNotify=true
      MimeType=x-scheme-handler/mailto
mime:
  key: x-scheme-handler/mailto
  obsolete_handler: HEY.desktop
statuses:
  success: 0
