commands:
  i18n: [arch-i18n]
  install: [install]
arguments:
  install_mode: [-m, "0644"]
paths:
  nvim_config_dir: .config/nvim
  nvim_provider: .config/nvim/lua/config/remote_clipboard.lua
  nvim_options: .config/nvim/lua/config/options.lua
  provider_source: /usr/share/neovim/config/lua/config/remote_clipboard.lua
  tmux_config: .config/tmux/tmux.conf
patterns:
  clipboard_feature: '(^|[[:space:],"])\*:clipboard([[:space:],"]|$)'
values:
  module_parts: [config, remote_clipboard]
  module_separator: .
  module_placeholder: MODULE
  setup_line_parts: ['require("', MODULE, '").setup()']
  tmux_setting: 'set -as terminal-features ",*:clipboard"'
  line_break: "\n"
messages:
  reason: migration.enableSecureRemoteNeovimClipboard
  tmux_comment: migration.tmuxClipboardForwardingComment
statuses:
  success: 0
