commands:
  i18n: [arch-i18n]
  install: [sudo, install, -Dm644]
  remove: [sudo, rm, -f]
paths:
  session_dir_environment: ARCH_WAYLAND_SESSIONS_DIR
  session_dir_default: /usr/local/share/wayland-sessions
  source_file: default/wayland-sessions/arch.desktop
  session_filename: [arch, desktop]
  obsolete_sessions_glob: '*archy.desktop'
messages:
  source_missing: migration.archSessionEntryMissing
statuses:
  success: 0
  failure: 1
