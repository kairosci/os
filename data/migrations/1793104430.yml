messages:
  reason: migration.removeRetiredWorkspaceTool
packages:
  drop: [arch-herdr, herdr]
mise:
  tool: herdr
  actions:
    - [unuse, -g, herdr]
    - [uninstall, -a, herdr]
paths:
  files:
    - .local/bin/herdr
    - .local/share/mise/shims/herdr
    - .local/state/arch/toggles/herdr-theme-sync
  directories:
    - .local/share/mise/installs/herdr
    - .config/herdr
