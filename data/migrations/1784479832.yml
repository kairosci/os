commands:
  i18n: [arch-i18n]
paths:
  kitty_config: .config/kitty/kitty.conf
patterns:
  listen_on: '^[ \t]*listen_on[ \t]'
append:
  block: "\n# Allow cwd lookup from global keybindings\n"
values:
  listen_on: 'listen_on unix:${XDG_RUNTIME_DIR}/arch-kitty-{kitty_pid}'
messages:
  reason: migration.enableKittyCwdLookup
statuses:
  success: 0
