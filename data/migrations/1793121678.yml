commands:
  i18n: [arch-i18n]
  edit_config: [sudo, sed, --in-place, --expression]
configuration:
  environment: ARCH_PACMAN_CONFIG_PATH
  default: /etc/pacman.conf
  section_header: "[arch-mact2]"
  signature_expression: >-
    /^\[arch-mact2\]$/,/^\[/ {
      /^[[:space:]]*SigLevel[[:space:]]*=/ {
        /PackageRequired/! {
          /[[:space:]]Required\([[:space:]]\|$\)/! s#^[[:space:]]*SigLevel[[:space:]]*=.*$#SigLevel = PackageRequired#
        }
      }
    }
messages:
  changed: migration.requireT2PackageSignatures
  invalid_config: security.pacmanConfigInvalid
statuses:
  success: 0
  failure: 1
