# Insert arch-mac-encrypt after vendorfw/block and sd-encrypt immediately
# before filesystems, each only if that hook is absent. 90-arch-mac.conf
# already put asahi and arch-vendorfw before filesystems; this drop-in is
# sourced after it.
#
# Both are systemd initrd units: the systemd hook replaces udev (mkinitcpio's
# stock HOOKS line) and keymap/consolefont become sd-vconsole. A HOOKS line
# carrying the busybox encrypt hook belongs to a Mac unlocked by cryptdevice=,
# which sd-encrypt cannot parse: that line is left exactly as it is.
_arch_mac_encrypt_hooks=()
_arch_mac_encrypt_have_systemd=false
_arch_mac_encrypt_have_vconsole=false
_arch_mac_encrypt_have_encrypt=false
for _arch_mac_encrypt_hook in "${HOOKS[@]}"; do
  case $_arch_mac_encrypt_hook in
    systemd) _arch_mac_encrypt_have_systemd=true ;;
    sd-vconsole) _arch_mac_encrypt_have_vconsole=true ;;
    encrypt) _arch_mac_encrypt_have_encrypt=true ;;
  esac
done
if [[ $_arch_mac_encrypt_have_encrypt == false ]]; then
for _arch_mac_encrypt_hook in "${HOOKS[@]}"; do
  case $_arch_mac_encrypt_hook in
    udev)
      if [[ $_arch_mac_encrypt_have_systemd == false ]]; then
        _arch_mac_encrypt_hooks+=(systemd)
        _arch_mac_encrypt_have_systemd=true
      fi
      ;;
    keymap|consolefont)
      if [[ $_arch_mac_encrypt_have_vconsole == false ]]; then
        _arch_mac_encrypt_hooks+=(sd-vconsole)
        _arch_mac_encrypt_have_vconsole=true
      fi
      ;;
    *) _arch_mac_encrypt_hooks+=("$_arch_mac_encrypt_hook") ;;
  esac
done
if [[ $_arch_mac_encrypt_have_systemd == false ]]; then
  if [[ ${_arch_mac_encrypt_hooks[0]:-} == base ]]; then
    _arch_mac_encrypt_hooks=(base systemd "${_arch_mac_encrypt_hooks[@]:1}")
  else
    _arch_mac_encrypt_hooks=(systemd "${_arch_mac_encrypt_hooks[@]}")
  fi
fi
HOOKS=("${_arch_mac_encrypt_hooks[@]}")
_arch_mac_encrypt_hooks=()
_arch_mac_encrypt_have_ours=false
_arch_mac_encrypt_have_sd=false
_arch_mac_encrypt_added_ours=false
_arch_mac_encrypt_added_sd=false
for _arch_mac_encrypt_hook in "${HOOKS[@]}"; do
  if [[ $_arch_mac_encrypt_hook == arch-mac-encrypt ]]; then
    _arch_mac_encrypt_have_ours=true
  fi
  if [[ $_arch_mac_encrypt_hook == sd-encrypt ]]; then
    _arch_mac_encrypt_have_sd=true
  fi
done
for _arch_mac_encrypt_hook in "${HOOKS[@]}"; do
  if [[ $_arch_mac_encrypt_hook == sd-encrypt && $_arch_mac_encrypt_have_ours == false &&
        $_arch_mac_encrypt_added_ours == false ]]; then
    _arch_mac_encrypt_hooks+=(arch-mac-encrypt)
    _arch_mac_encrypt_added_ours=true
  fi
  if [[ $_arch_mac_encrypt_hook == filesystems ]]; then
    if [[ $_arch_mac_encrypt_have_ours == false && $_arch_mac_encrypt_added_ours == false ]]; then
      _arch_mac_encrypt_hooks+=(arch-mac-encrypt)
      _arch_mac_encrypt_added_ours=true
    fi
    if [[ $_arch_mac_encrypt_have_sd == false && $_arch_mac_encrypt_added_sd == false ]]; then
      _arch_mac_encrypt_hooks+=(sd-encrypt)
      _arch_mac_encrypt_added_sd=true
    fi
  fi
  _arch_mac_encrypt_hooks+=("$_arch_mac_encrypt_hook")
done
if [[ $_arch_mac_encrypt_have_ours == false && $_arch_mac_encrypt_added_ours == false ]]; then
  _arch_mac_encrypt_hooks+=(arch-mac-encrypt)
fi
if [[ $_arch_mac_encrypt_have_sd == false && $_arch_mac_encrypt_added_sd == false ]]; then
  _arch_mac_encrypt_hooks+=(sd-encrypt)
fi
HOOKS=("${_arch_mac_encrypt_hooks[@]}")
fi
unset _arch_mac_encrypt_hooks _arch_mac_encrypt_hook \
  _arch_mac_encrypt_have_ours _arch_mac_encrypt_have_sd \
  _arch_mac_encrypt_added_ours _arch_mac_encrypt_added_sd \
  _arch_mac_encrypt_have_systemd _arch_mac_encrypt_have_vconsole \
  _arch_mac_encrypt_have_encrypt
