# Time servers for when nothing else names one. NTP= in /etc and servers a
# network hands out through systemd-networkd still come first. Setting this
# replaces systemd's built-in Arch pool. ntp.github.com/kairosci/arch is os's own
# name, so where it points can change without an update; time.cloudflare.com
# answers when it does not.
#
# To use other servers, set NTP= in /etc/systemd/timesyncd.conf.d/. To
# replace this list, start your own drop-in there with an empty FallbackNTP=.
[Time]
FallbackNTP=ntp.github.com/kairosci/arch time.cloudflare.com
