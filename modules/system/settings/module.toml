id = "system.settings"
domain = "system"
package = "arch-settings"
sources = ["config", "default", "assets/applications", "etc", "logo.txt", "icon.txt", "icon.png", "logo.svg", "arch-mark.svg", "src/cli/arch-debug", "src/cli/arch-debug-idle", "src/cli/arch-upload-log"]
requires = []

[[output]]
source = "config"
target = "usr/share/arch/config"

[[output]]
source = "assets/applications"
target = "usr/share/arch/applications"

[[output]]
source = "etc"
target = "etc"

[[output]]
source = "default"
target = "usr/share/arch/default"

[[output]]
source = "icon.png"
target = "usr/share/icons/hicolor/256x256/apps/arch.png"

[[output]]
source = "logo.txt"
target = "etc/skel/.config/arch/branding/screensaver.txt"

[[output]]
source = "icon.txt"
target = "etc/skel/.config/arch/branding/about.txt"

[[output]]
source = "default/uwsm/env.d/10-arch"
target = "usr/share/uwsm/env.d/10-arch"

[[output]]
source = "default/environment.d/10-arch-fcitx.conf"
target = "usr/lib/environment.d/10-arch-fcitx.conf"

[[output]]
source = "default/xdg-terminal-exec/hyprland-xdg-terminals.list"
target = "usr/share/xdg-terminal-exec/hyprland-xdg-terminals.list"

[[output]]
source = "default/applications/mimeapps.list"
target = "usr/share/applications/mimeapps.list"

[[output]]
source = "default/fonts/arch/arch.ttf"
target = "usr/share/fonts/arch/arch.ttf"

[[output]]
source = "default/sddm/hyprland.lua"
target = "usr/share/sddm/hyprland.lua"

[[output]]
source = "default/sddm/arch"
target = "usr/share/sddm/themes/arch"

[[output]]
source = "default/plymouth"
target = "usr/share/plymouth/themes/arch"

[[output]]
source = "default/systemd/user"
target = "usr/lib/systemd/user"

[[output]]
source = "default/systemd/system"
target = "usr/lib/systemd/system"

[[output]]
source = "default/systemd/system-sleep/unmount-fuse"
target = "usr/lib/systemd/system-sleep/unmount-fuse"

[[output]]
source = "default/systemd/zram-generator.conf.d/90-arch.conf"
target = "usr/lib/systemd/zram-generator.conf.d/90-arch.conf"

[[output]]
source = "src/cli/arch-debug"
target = "usr/bin/arch-debug"

[[output]]
source = "src/cli/arch-debug-idle"
target = "usr/bin/arch-debug-idle"

[[output]]
source = "src/cli/arch-upload-log"
target = "usr/bin/arch-upload-log"
