id = "system.settings.defaults"
domain = "system"
package = "arch-settings"
sources = [
  "default/bashrc",
  "default/settings-runtime-profile",
  "default/xcompose",
]
requires = ["system.settings"]

[[output]]
source = "default/bashrc"
target = "usr/share/arch/default/bashrc"

[[output]]
source = "default/settings-runtime-profile"
target = "usr/share/arch/default/settings-runtime-profile"

[[output]]
source = "default/xcompose"
target = "usr/share/arch/default/xcompose"
