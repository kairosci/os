id = "system.settings.preinstall-tools"
domain = "system"
package = "arch-settings"
sources = [
  "src/arch/commands/arch-debug",
  "src/arch/commands/arch-debug-idle",
  "src/arch/commands/arch-upload-log",
]
requires = ["system.settings"]

[[output]]
source = "src/arch/commands/arch-debug"
target = "usr/bin/arch-debug"

[[output]]
source = "src/arch/commands/arch-debug-idle"
target = "usr/bin/arch-debug-idle"

[[output]]
source = "src/arch/commands/arch-upload-log"
target = "usr/bin/arch-upload-log"
