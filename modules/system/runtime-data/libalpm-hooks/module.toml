id = "system.runtime-data.libalpm-hooks"
domain = "system"
package = "arch"
sources = [
  "default/libalpm/hooks/10-arch-hyprland-reload-pause.hook",
  "default/libalpm/hooks/20-arch-ap-path-migration.hook",
  "default/libalpm/hooks/90-arch-hyprland-reload-resume.hook",
]
requires = ["system.runtime-data"]

[[output]]
source = "default/libalpm/hooks/10-arch-hyprland-reload-pause.hook"
