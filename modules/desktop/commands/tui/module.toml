id = "desktop.commands.tui"
domain = "desktop"
package = "arch"
sources = [
  "src/commands/arch-tui-install",
  "src/cli/tui/install.py",
  "src/commands/arch-tui-remove",
  "src/commands/arch-tui-remove-all",
]
requires = ["desktop.commands"]

[[output]]
source = "src/commands/arch-tui-install"
target = "usr/share/arch/src/commands/arch-tui-install"

[[output]]
source = "src/cli/tui/install.py"
target = "usr/share/arch/src/cli/tui/install.py"

[[output]]
source = "src/commands/arch-tui-remove"
target = "usr/share/arch/src/commands/arch-tui-remove"

[[output]]
source = "src/commands/arch-tui-remove-all"
target = "usr/share/arch/src/commands/arch-tui-remove-all"
