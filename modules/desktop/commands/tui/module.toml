id = "desktop.commands.tui"
domain = "desktop"
package = "arch"
sources = [
  "src/cli/arch-tui-install",
  "src/python/cli/tui_install.py",
  "src/cli/arch-tui-remove",
  "src/cli/arch-tui-remove-all",
]
requires = ["desktop.commands"]

[[output]]
source = "src/cli/arch-tui-install"
target = "usr/share/arch/src/cli/arch-tui-install"

[[output]]
source = "src/python/cli/tui_install.py"
target = "usr/share/arch/src/python/cli/tui_install.py"

[[output]]
source = "src/cli/arch-tui-remove"
target = "usr/share/arch/src/cli/arch-tui-remove"

[[output]]
source = "src/cli/arch-tui-remove-all"
target = "usr/share/arch/src/cli/arch-tui-remove-all"
