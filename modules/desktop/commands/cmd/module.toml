id = "desktop.commands.cmd"
domain = "desktop"
package = "arch"
sources = [
  "src/commands/arch-cmd-browser-handoff",
  "src/commands/arch-cmd-default-browser",
  "src/commands/arch-cmd-missing",
  "src/cli/command/presence.py",
  "src/commands/arch-cmd-present",
  "src/commands/arch-cmd-terminal-cwd",
]
requires = ["desktop.commands"]

[[output]]
source = "src/commands/arch-cmd-browser-handoff"
target = "usr/share/arch/src/commands/arch-cmd-browser-handoff"

[[output]]
source = "src/commands/arch-cmd-default-browser"
target = "usr/share/arch/src/commands/arch-cmd-default-browser"

[[output]]
source = "src/commands/arch-cmd-missing"
target = "usr/share/arch/src/commands/arch-cmd-missing"

[[output]]
source = "src/cli/command/presence.py"
target = "usr/share/arch/src/cli/command/presence.py"

[[output]]
source = "src/commands/arch-cmd-present"
target = "usr/share/arch/src/commands/arch-cmd-present"

[[output]]
source = "src/commands/arch-cmd-terminal-cwd"
target = "usr/share/arch/src/commands/arch-cmd-terminal-cwd"
