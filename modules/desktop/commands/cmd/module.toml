id = "desktop.commands.cmd"
domain = "desktop"
package = "arch"
sources = [
  "src/arch/commands/arch-cmd-browser-handoff",
  "src/arch/cli/command/presence.py",
  "src/arch/commands/arch-cmd-terminal-cwd",
]
requires = ["desktop.commands"]

[[output]]
source = "src/arch/commands/arch-cmd-browser-handoff"
