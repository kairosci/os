id = "desktop.commands.menu"
domain = "desktop"
package = "arch"
sources = [
  "src/arch/commands/arch-menu",
  "src/arch/commands/arch-menu-file",
  "src/arch/commands/arch-menu-images",
  "src/arch/commands/arch-menu-input",
  "src/arch/commands/arch-menu-keybindings",
  "src/arch/commands/arch-menu-plugin",
  "src/arch/commands/arch-menu-select",
  "src/arch/commands/arch-menu-share",
  "src/arch/commands/arch-menu-timezone",
  "src/arch/commands/arch-menu-tmux-keybindings",
  "src/arch/cli/menu/launch.py",
  "src/arch/cli/menu/emoji_insert.py",
]
requires = ["desktop.commands", "system.runtime-data"]

[[output]]
