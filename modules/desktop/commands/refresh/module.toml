id = "desktop.commands.refresh"
domain = "desktop"
package = "arch"
sources = [
  "src/arch/commands/arch-refresh-applications",
  "src/arch/commands/arch-refresh-chromium",
  "src/arch/cli/refresh/config.py",
  "src/arch/cli/refresh/actions.py",
  "src/arch/commands/arch-refresh-hyprland",
  "src/arch/commands/arch-refresh-hyprsunset",
  "src/arch/commands/arch-refresh-limine",
  "src/arch/commands/arch-refresh-pacman",
  "src/arch/commands/arch-refresh-plymouth",
  "src/arch/commands/arch-refresh-sddm",
  "src/arch/commands/arch-refresh-shell",
]
requires = ["desktop.commands", "system.runtime-data"]

[[output]]
source = "src/arch/commands/arch-refresh-applications"
target = "usr/share/arch/src/arch/commands/arch-refresh-applications"

[[output]]
source = "src/arch/commands/arch-refresh-chromium"
target = "usr/share/arch/src/arch/commands/arch-refresh-chromium"

[[output]]
source = "src/arch/cli/refresh/config.py"
target = "usr/share/arch/src/arch/cli/refresh/config.py"

[[output]]
source = "src/arch/cli/refresh/actions.py"
target = "usr/share/arch/src/arch/cli/refresh/actions.py"

[[output]]
source = "src/arch/commands/arch-refresh-hyprland"
target = "usr/share/arch/src/arch/commands/arch-refresh-hyprland"

[[output]]
source = "src/arch/commands/arch-refresh-hyprsunset"
target = "usr/share/arch/src/arch/commands/arch-refresh-hyprsunset"

[[output]]
source = "src/arch/commands/arch-refresh-limine"
target = "usr/share/arch/src/arch/commands/arch-refresh-limine"

[[output]]
source = "src/arch/commands/arch-refresh-pacman"
target = "usr/share/arch/src/arch/commands/arch-refresh-pacman"

[[output]]
source = "src/arch/commands/arch-refresh-plymouth"
target = "usr/share/arch/src/arch/commands/arch-refresh-plymouth"

[[output]]
source = "src/arch/commands/arch-refresh-sddm"
target = "usr/share/arch/src/arch/commands/arch-refresh-sddm"

[[output]]
