id = "desktop.commands.restart"
domain = "desktop"
package = "arch"
sources = [
  "src/commands/arch-restart-app",
  "src/commands/arch-restart-audio",
  "src/commands/arch-restart-bluetooth",
  "src/commands/arch-restart-btop",
  "src/commands/arch-restart-gum",
  "src/commands/arch-restart-helix",
  "src/commands/arch-restart-hyprctl",
  "src/cli/restart/hyprland.py",
  "src/commands/arch-restart-hyprsunset",
  "src/commands/arch-restart-shell",
  "src/commands/arch-restart-terminal",
  "src/commands/arch-restart-tmux",
  "src/commands/arch-restart-trackpad",
  "src/commands/arch-restart-wifi",
  "src/commands/arch-restart-xcompose",
]
requires = ["desktop.commands"]

[[output]]
source = "src/commands/arch-restart-app"
target = "usr/share/arch/src/commands/arch-restart-app"

