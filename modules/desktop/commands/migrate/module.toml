id = "desktop.commands.migrate"
domain = "desktop"
package = "arch"
sources = [
  "src/cli/arch-migrate",
  "src/python/cli/migrate.py",
  "src/cli/arch-migrate-notify",
]
requires = ["desktop.commands", "system.runtime-data"]

[[output]]
source = "src/cli/arch-migrate"
target = "usr/share/arch/src/cli/arch-migrate"

[[output]]
source = "src/python/cli/migrate.py"
target = "usr/share/arch/src/python/cli/migrate.py"

[[output]]
source = "src/cli/arch-migrate-notify"
target = "usr/share/arch/src/cli/arch-migrate-notify"
