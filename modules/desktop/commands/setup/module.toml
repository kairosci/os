id = "desktop.commands.setup"
domain = "desktop"
package = "arch"
sources = [
  "src/commands/arch-setup-direct-boot",
  "src/commands/arch-setup-input",
  "src/commands/arch-setup-keyboard",
  "src/commands/arch-setup-security-fido2",
  "src/commands/arch-setup-security-fingerprint",
  "src/commands/arch-setup-security-ssh-agent",
  "src/commands/arch-setup-security-sshd",
  "src/commands/arch-setup-security-sudoless-docker",
]
requires = ["desktop.commands"]

[[output]]
source = "src/commands/arch-setup-direct-boot"
target = "usr/share/arch/src/commands/arch-setup-direct-boot"

[[output]]
source = "src/commands/arch-setup-input"
target = "usr/share/arch/src/commands/arch-setup-input"

[[output]]
source = "src/commands/arch-setup-keyboard"
target = "usr/share/arch/src/commands/arch-setup-keyboard"

[[output]]
source = "src/commands/arch-setup-security-fido2"
target = "usr/share/arch/src/commands/arch-setup-security-fido2"

[[output]]
source = "src/commands/arch-setup-security-fingerprint"
target = "usr/share/arch/src/commands/arch-setup-security-fingerprint"

[[output]]
source = "src/commands/arch-setup-security-ssh-agent"
target = "usr/share/arch/src/commands/arch-setup-security-ssh-agent"

[[output]]
source = "src/commands/arch-setup-security-sshd"
target = "usr/share/arch/src/commands/arch-setup-security-sshd"

[[output]]
source = "src/commands/arch-setup-security-sudoless-docker"
target = "usr/share/arch/src/commands/arch-setup-security-sudoless-docker"
