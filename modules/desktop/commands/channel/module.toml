id = "desktop.commands.channel"
domain = "desktop"
package = "arch"
sources = [
  "src/commands/arch-channel-current",
  "src/commands/arch-channel-set",
  "src/cli/channel.py",
]
requires = ["desktop.commands", "desktop.commands.version", "system.runtime-data"]

[[output]]
source = "src/commands/arch-channel-current"
target = "usr/share/arch/src/commands/arch-channel-current"

[[output]]
source = "src/commands/arch-channel-set"
target = "usr/share/arch/src/commands/arch-channel-set"

[[output]]
source = "src/cli/channel.py"
target = "usr/share/arch/src/cli/channel.py"
