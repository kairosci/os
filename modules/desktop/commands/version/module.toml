id = "desktop.commands.version"
domain = "desktop"
package = "arch"
sources = [
  "src/cli/arch-version",
  "src/cli/arch-version-branch",
  "src/cli/arch-version-channel",
  "src/cli/arch-version-pkgs",
  "src/python/cli/version_pkgs.py",
  "src/python/cli/version.py",
]
requires = ["desktop.commands", "system.runtime-data"]

[[output]]
source = "src/cli/arch-version"
target = "usr/share/arch/src/cli/arch-version"

[[output]]
source = "src/cli/arch-version-branch"
target = "usr/share/arch/src/cli/arch-version-branch"

[[output]]
source = "src/cli/arch-version-channel"
target = "usr/share/arch/src/cli/arch-version-channel"

[[output]]
source = "src/cli/arch-version-pkgs"
target = "usr/share/arch/src/cli/arch-version-pkgs"

[[output]]
source = "src/python/cli/version_pkgs.py"
target = "usr/share/arch/src/python/cli/version_pkgs.py"

[[output]]
source = "src/python/cli/version.py"
target = "usr/share/arch/src/python/cli/version.py"
