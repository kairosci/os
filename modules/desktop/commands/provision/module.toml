  "src/arch/commands/arch-provision-first-run",
  "src/arch/commands/arch-provision-hardware",
  "src/arch/commands/arch-provision-owner",
  "src/arch/commands/arch-provision-user",
]
requires = ["desktop.commands"]

[[output]]
source = "src/arch/commands/arch-provision-first-run"
