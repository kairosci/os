[[output]]
source = "src/arch/commands/arch-provision-owner"
target = "usr/share/arch/src/arch/commands/arch-provision-owner"

[[output]]
source = "src/arch/commands/arch-provision-user"
target = "usr/share/arch/src/arch/commands/arch-provision-user"
