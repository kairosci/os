id = "desktop.commands.font"
domain = "desktop"
package = "arch"
sources = [
  "src/commands/arch-font-cjk",
  "src/commands/arch-font-current",
  "src/commands/arch-font-list",
  "src/commands/arch-font-set",
  "src/cli/fonts.py",
  "src/cli/font_set.py",
]
requires = ["desktop.commands", "system.runtime-data"]

[[output]]
source = "src/commands/arch-font-cjk"
target = "usr/share/arch/src/commands/arch-font-cjk"

[[output]]
source = "src/commands/arch-font-current"
target = "usr/share/arch/src/commands/arch-font-current"

[[output]]
source = "src/commands/arch-font-list"
target = "usr/share/arch/src/commands/arch-font-list"

[[output]]
source = "src/commands/arch-font-set"
target = "usr/share/arch/src/commands/arch-font-set"

[[output]]
source = "src/cli/fonts.py"
target = "usr/share/arch/src/cli/fonts.py"

[[output]]
source = "src/cli/font_set.py"
target = "usr/share/arch/src/cli/font_set.py"
