id = "desktop.commands.font"
domain = "desktop"
package = "arch"
sources = [
  "src/arch/commands/arch-font-cjk",
  "src/arch/commands/arch-font-current",
  "src/arch/commands/arch-font-list",
  "src/arch/cli/font/catalog.py",
  "src/arch/cli/font/set.py",
]
requires = ["desktop.commands", "system.runtime-data"]

[[output]]
source = "src/arch/commands/arch-font-cjk"
target = "usr/share/arch/src/arch/commands/arch-font-cjk"

[[output]]
source = "src/arch/commands/arch-font-current"
target = "usr/share/arch/src/arch/commands/arch-font-current"

[[output]]
source = "src/arch/commands/arch-font-list"
target = "usr/share/arch/src/arch/commands/arch-font-list"

[[output]]
source = "src/arch/cli/font/catalog.py"
target = "usr/share/arch/src/arch/cli/font/catalog.py"

[[output]]
source = "src/arch/cli/font/set.py"
target = "usr/share/arch/src/arch/cli/font/set.py"
