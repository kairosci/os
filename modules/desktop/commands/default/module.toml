id = "desktop.commands.default"
domain = "desktop"
package = "arch"
sources = [
  "src/commands/arch-default-browser",
  "src/commands/arch-default-dictation",
  "src/commands/arch-default-editor",
  "src/commands/arch-default-terminal",
]
requires = ["desktop.commands"]

[[output]]
source = "src/commands/arch-default-browser"
target = "usr/share/arch/src/commands/arch-default-browser"

[[output]]
source = "src/commands/arch-default-dictation"
target = "usr/share/arch/src/commands/arch-default-dictation"

[[output]]
source = "src/commands/arch-default-editor"
target = "usr/share/arch/src/commands/arch-default-editor"

[[output]]
source = "src/commands/arch-default-terminal"
target = "usr/share/arch/src/commands/arch-default-terminal"
