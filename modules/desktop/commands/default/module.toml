id = "desktop.commands.default"
domain = "desktop"
package = "arch"
sources = [
  "src/arch/cli/default/browser.py",
  "src/arch/cli/default/editor.py",
  "src/arch/cli/default/dictation.py",
  "src/arch/cli/default/terminal.py",
]
requires = ["desktop.commands", "system.runtime-data"]

[[output]]
source = "src/arch/cli/default/browser.py"
target = "usr/share/arch/src/arch/cli/default/browser.py"

[[output]]
source = "src/arch/cli/default/editor.py"
target = "usr/share/arch/src/arch/cli/default/editor.py"

[[output]]
source = "src/arch/cli/default/dictation.py"
target = "usr/share/arch/src/arch/cli/default/dictation.py"

[[output]]
source = "src/arch/cli/default/terminal.py"
target = "usr/share/arch/src/arch/cli/default/terminal.py"
