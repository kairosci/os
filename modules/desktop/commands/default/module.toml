id = "desktop.commands.default"
domain = "desktop"
package = "arch"
sources = [
  "src/cli/arch-default-agent",
  "src/cli/arch-default-browser",
  "src/cli/arch-default-dictation",
  "src/cli/arch-default-editor",
  "src/cli/arch-default-terminal",
]
requires = ["desktop.commands"]

[[output]]
source = "src/cli/arch-default-agent"
target = "usr/share/arch/src/cli/arch-default-agent"

[[output]]
source = "src/cli/arch-default-browser"
target = "usr/share/arch/src/cli/arch-default-browser"

[[output]]
source = "src/cli/arch-default-dictation"
target = "usr/share/arch/src/cli/arch-default-dictation"

[[output]]
source = "src/cli/arch-default-editor"
target = "usr/share/arch/src/cli/arch-default-editor"

[[output]]
source = "src/cli/arch-default-terminal"
target = "usr/share/arch/src/cli/arch-default-terminal"
