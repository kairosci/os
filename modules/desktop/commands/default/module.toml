id = "desktop.commands.default"
domain = "desktop"
package = "arch"
sources = [
  "src/arch/commands/arch-default-browser",
  "src/arch/commands/arch-default-editor",
  "src/arch/cli/default/dictation.py",
  "src/arch/cli/default/terminal.py",
]
requires = ["desktop.commands", "system.runtime-data"]

[[output]]
source = "src/arch/commands/arch-default-browser"
target = "usr/share/arch/src/arch/commands/arch-default-browser"

[[output]]
source = "src/arch/commands/arch-default-editor"
target = "usr/share/arch/src/arch/commands/arch-default-editor"

[[output]]
source = "src/arch/cli/default/dictation.py"
target = "usr/share/arch/src/arch/cli/default/dictation.py"

[[output]]
source = "src/arch/cli/default/terminal.py"
target = "usr/share/arch/src/arch/cli/default/terminal.py"
