id = "desktop.commands.notification"
domain = "desktop"
package = "arch"
sources = [
  "src/arch/commands/arch-notification-battery",
  "src/arch/cli/notification/dismiss.py",
  "src/arch/commands/arch-notification-send",
  "src/arch/cli/notification/time.py",
  "src/arch/cli/notification/wait.py",
  "src/arch/commands/arch-notification-weather",
]
requires = ["desktop.commands", "system.runtime-data"]

[[output]]
source = "src/arch/commands/arch-notification-battery"
target = "usr/share/arch/src/arch/commands/arch-notification-battery"

[[output]]
source = "src/arch/cli/notification/dismiss.py"
target = "usr/share/arch/src/arch/cli/notification/dismiss.py"

[[output]]
source = "src/arch/commands/arch-notification-send"
target = "usr/share/arch/src/arch/commands/arch-notification-send"

[[output]]
source = "src/arch/cli/notification/time.py"
target = "usr/share/arch/src/arch/cli/notification/time.py"

[[output]]
source = "src/arch/cli/notification/wait.py"
target = "usr/share/arch/src/arch/cli/notification/wait.py"

[[output]]
source = "src/arch/commands/arch-notification-weather"
target = "usr/share/arch/src/arch/commands/arch-notification-weather"
