id = "desktop.commands.notification"
domain = "desktop"
package = "arch"
sources = [
  "src/commands/arch-notification-battery",
  "src/commands/arch-notification-dismiss",
  "src/commands/arch-notification-send",
  "src/commands/arch-notification-time",
  "src/commands/arch-notification-wait",
  "src/cli/notification_wait.py",
  "src/commands/arch-notification-weather",
]
requires = ["desktop.commands"]

[[output]]
source = "src/commands/arch-notification-battery"
target = "usr/share/arch/src/commands/arch-notification-battery"

[[output]]
source = "src/commands/arch-notification-dismiss"
target = "usr/share/arch/src/commands/arch-notification-dismiss"

[[output]]
source = "src/commands/arch-notification-send"
target = "usr/share/arch/src/commands/arch-notification-send"

[[output]]
source = "src/commands/arch-notification-time"
target = "usr/share/arch/src/commands/arch-notification-time"

[[output]]
source = "src/commands/arch-notification-wait"
target = "usr/share/arch/src/commands/arch-notification-wait"

[[output]]
source = "src/cli/notification_wait.py"
target = "usr/share/arch/src/cli/notification_wait.py"

[[output]]
source = "src/commands/arch-notification-weather"
target = "usr/share/arch/src/commands/arch-notification-weather"
