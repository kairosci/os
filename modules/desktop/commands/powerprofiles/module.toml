id = "desktop.commands.powerprofiles"
domain = "desktop"
package = "arch"
sources = [
  "src/commands/arch-powerprofiles-init",
  "src/commands/arch-powerprofiles-list",
  "src/commands/arch-powerprofiles-set",
]
requires = ["desktop.commands"]

[[output]]
source = "src/commands/arch-powerprofiles-init"
target = "usr/share/arch/src/commands/arch-powerprofiles-init"

[[output]]
source = "src/commands/arch-powerprofiles-list"
target = "usr/share/arch/src/commands/arch-powerprofiles-list"

[[output]]
source = "src/commands/arch-powerprofiles-set"
target = "usr/share/arch/src/commands/arch-powerprofiles-set"
