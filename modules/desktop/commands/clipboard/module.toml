id = "desktop.commands.clipboard"
domain = "desktop"
package = "arch"
sources = [
  "src/arch/commands/arch-clipboard-open",
  "src/arch/commands/arch-clipboard-paste-file",
  "src/arch/commands/arch-clipboard-paste-text",
]
requires = ["desktop.commands"]

[[output]]
source = "src/arch/commands/arch-clipboard-open"
target = "usr/share/arch/src/arch/commands/arch-clipboard-open"

[[output]]
source = "src/arch/commands/arch-clipboard-paste-file"
target = "usr/share/arch/src/arch/commands/arch-clipboard-paste-file"

[[output]]
source = "src/arch/commands/arch-clipboard-paste-text"
target = "usr/share/arch/src/arch/commands/arch-clipboard-paste-text"
