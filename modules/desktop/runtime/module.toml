id = "desktop.runtime"
domain = "desktop"
package = "arch"
sources = ["src/shell/Commons", "src/shell/Ui", "src/shell/services", "src/shell/shell.qml", "src/shell/README.md", "src/shell/plugins/README.md", "assets/themes"]
requires = ["system.settings", "system.runtime-data", "desktop.branding"]

[[output]]
source = "src/shell/Commons"
target = "usr/share/arch/src/shell/Commons"

[[output]]
source = "src/shell/Ui"
target = "usr/share/arch/src/shell/Ui"

[[output]]
source = "src/shell/services"
target = "usr/share/arch/src/shell/services"

[[output]]
source = "src/shell/shell.qml"
target = "usr/share/arch/src/shell/shell.qml"

[[output]]
source = "src/shell/README.md"
target = "usr/share/arch/src/shell/README.md"

[[output]]
source = "src/shell/plugins/README.md"
target = "usr/share/arch/src/shell/plugins/README.md"

[[output]]
source = "assets/themes"
target = "usr/share/arch/assets/themes"
