id = "desktop.branding.preinstall"
domain = "desktop"
package = "arch-settings"
sources = ["assets/branding/logo.txt", "assets/branding/icon.txt", "assets/branding/arch-symbol.png"]
requires = ["system.settings"]

[[output]]
source = "assets/branding/arch-symbol.png"
target = "usr/share/icons/hicolor/256x256/apps/arch.png"

[[output]]
source = "assets/branding/logo.txt"
target = "etc/skel/.config/arch/branding/screensaver.txt"

[[output]]
source = "assets/branding/icon.txt"
target = "etc/skel/.config/arch/branding/about.txt"
