id = "desktop.branding"
domain = "desktop"
package = "arch"
sources = ["version", "assets/branding/arch-mark.svg", "assets/branding/icon.txt", "assets/branding/logo.txt", "assets/branding/logo.svg", "assets/branding/arch-symbol.png"]
requires = ["system.settings"]

[[output]]
source = "version"
target = "usr/share/arch/version"

[[output]]
source = "assets/branding/arch-mark.svg"
target = "usr/share/arch/assets/branding/arch-mark.svg"

[[output]]
source = "assets/branding/icon.txt"
target = "usr/share/arch/assets/branding/icon.txt"

[[output]]
source = "assets/branding/logo.txt"
target = "usr/share/arch/assets/branding/logo.txt"

[[output]]
source = "assets/branding/logo.svg"
target = "usr/share/arch/assets/branding/logo.svg"

[[output]]
source = "assets/branding/arch-symbol.png"
target = "usr/share/arch/assets/branding/arch-symbol.png"
